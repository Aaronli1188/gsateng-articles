<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gsatword</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh;font-size:16px}

/* ── Layout ── */
.hdr{background:#1a1a1a;color:#fff;padding:0 24px;display:flex;align-items:center;height:56px;gap:16px;position:sticky;top:0;z-index:20}
.hdr h1{font-size:.9rem;font-weight:700;letter-spacing:.08em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.main{padding:28px 24px;max-width:1100px;margin:0 auto}

/* ── Buttons ── */
.btn{border:none;padding:10px 22px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;font-family:inherit}
.btn-dark{background:#1a1a1a;color:#fff}
.btn-dark:hover{background:#333}
.btn-outline{background:#fff;color:#555;border:1px solid #ddd}
.btn-outline:hover{background:#f5f5f5}
.btn-green{background:#2e7d32;color:#fff}
.btn-green:hover{background:#1b5e20}
.btn-red{background:#c62828;color:#fff}
.btn-red:hover{background:#b71c1c}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}

/* ── Cards / panels ── */
.card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.section-title{font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}

/* ── Error / loading ── */
#error-screen{display:none;text-align:center;padding:80px 24px}
#error-screen h2{font-size:1.2rem;margin-bottom:10px}
#error-screen p{color:#888;font-size:.9rem}
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:.9rem;color:#aaa}

/* ── Student view ── */
#student-view{display:none}
.student-name-badge{font-size:.8rem;background:#d32f2f;color:#fff;padding:3px 12px;border-radius:12px;font-weight:700}
.stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.stat-box{background:#fff;border-radius:10px;padding:16px 22px;flex:1;min-width:120px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-box .val{font-size:2rem;font-weight:700;color:#1a1a1a}
.stat-box .lbl{font-size:.75rem;color:#999;margin-top:4px}

/* ── Flashcard ── */
.rev-wrap{max-width:680px;margin:0 auto}
.prog{text-align:center;color:#999;font-size:.85rem;margin-bottom:16px}
.flash-card{background:#fff;border-radius:14px;padding:36px 32px;box-shadow:0 2px 12px rgba(0,0,0,.1);min-height:200px}
.sentence{font-size:1.25rem;line-height:2.1;margin-bottom:8px}
.whi{color:#c62828;font-weight:700}
.zh-hint{margin:12px 0;padding:12px 16px;background:#f5f5f5;border-radius:8px;border-left:3px solid #bdbdbd}
.zh-meaning{font-size:1rem;color:#333;font-weight:600;margin-bottom:4px}
.zh-context{font-size:.88rem;color:#666;font-style:italic}
.rev-btns{display:flex;gap:12px;margin-top:24px}
.btn-y{flex:1;padding:18px;border:none;border-radius:9px;cursor:pointer;font-size:1.05rem;font-weight:700;background:#2e7d32;color:#fff}
.btn-y:hover{background:#1b5e20}
.btn-n{flex:1;padding:18px;border:none;border-radius:9px;cursor:pointer;font-size:1.05rem;font-weight:700;background:#c62828;color:#fff}
.btn-n:hover{background:#b71c1c}
.btn-y:disabled,.btn-n:disabled{opacity:.4;cursor:default;pointer-events:none}
.feedback{margin-top:12px;font-size:.92rem;text-align:center;min-height:22px;font-weight:600}
.card-sub-actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.sub-btn{padding:7px 18px;border-radius:7px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.82rem;color:#555;font-weight:500}
.sub-btn:hover{background:#f5f5f5}
.sub-btn-easy{border-color:#c8e6c9;color:#2e7d32}
.sub-btn-easy:hover{background:#e8f5e9}
.memo-area{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0}
.memo-area textarea{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:7px;font-size:.88rem;font-family:inherit;resize:vertical;min-height:56px;color:#444}
.memo-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.memo-ok{font-size:.8rem;color:#2e7d32}
.done-screen{text-align:center;padding:48px 24px}
.done-screen h2{font-size:1.3rem;margin-bottom:10px}
.done-screen p{color:#888;font-size:.92rem}

/* ── Teacher view ── */
#teacher-view{display:none}
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
.student-card{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .15s}
.student-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.12)}
.sc-name{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.sc-stats{display:flex;gap:10px;font-size:.8rem;color:#888;flex-wrap:wrap}
.sc-stats .due{color:#c62828;font-weight:700}
.sc-stats .mastered{color:#2e7d32;font-weight:600}
.sc-token{font-size:.72rem;color:#bbb;margin-top:8px;word-break:break-all}
.sc-token a{color:#1a0dab;text-decoration:none}
.sc-token a:hover{text-decoration:underline}

/* ── Teacher detail ── */
#teacher-detail{display:none}
.back-btn{background:none;border:none;cursor:pointer;font-size:.85rem;color:#555;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px}
.back-btn:hover{color:#1a1a1a}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;font-size:.88rem;border-bottom:1px solid #f0f0f0;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#999;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.73rem;font-weight:600}
.bm{background:#e8f5e9;color:#2e7d32}
.bd{background:#fce4ec;color:#c62828}
.bu{background:#e3f2fd;color:#1565c0}
.ctx-cell{color:#777;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ctx-cell.expanded{max-width:none;overflow:visible;white-space:normal;background:#fffde7;padding:4px 8px;border-radius:4px}

/* ── Setup ── */
#setup-screen{display:none;max-width:480px;margin:60px auto}
#setup-screen h2{font-size:1.1rem;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.77rem;color:#999;margin-bottom:5px;font-weight:600;text-transform:uppercase}
.field input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:.9rem;font-family:inherit}
.msg{margin-top:10px;padding:9px 13px;border-radius:7px;font-size:.85rem}
.msg-err{background:#ffebee;color:#c62828}
.msg-ok{background:#e8f5e9;color:#2e7d32}
</style>
</head>
<body>

<div class="hdr">
  <h1>gsatword</h1>
  <div class="hdr-right">
    <span id="name-badge" class="student-name-badge" style="display:none"></span>
  </div>
</div>

<div id="loading-screen">載入中…</div>
<div id="error-screen">
  <h2 id="err-title">無效的連結</h2>
  <p id="err-msg">請確認你的專屬連結是否正確。</p>
</div>

<!-- Student view -->
<div id="student-view">
  <div class="main">
    <div class="stats-row" id="stats-row"></div>
    <div class="rev-wrap" id="rev-wrap"></div>
  </div>
</div>

<!-- Teacher view -->
<div id="teacher-view">
  <div class="main">
    <div id="teacher-overview">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <p class="section-title" style="margin:0">所有學生</p>
        <button class="btn btn-dark" onclick="addStudentPrompt()">＋ 新增學生</button>
      </div>
      <div class="teacher-grid" id="teacher-grid"></div>
    </div>
    <div id="teacher-detail" style="display:none">
      <button class="back-btn" onclick="showTeacherOverview()">← 返回總覽</button>
      <p class="section-title" id="detail-title"></p>
      <div class="card" style="padding:0;overflow:auto">
        <table>
          <thead><tr>
            <th>單字</th><th>例句</th><th>中文</th><th>連對</th><th>下次複習</th><th>加入日</th><th>狀態</th>
          </tr></thead>
          <tbody id="detail-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Setup screen (first time) -->
<div id="setup-screen" class="main">
  <div class="card">
    <h2>設定 Supabase 連線</h2>
    <p style="color:#888;font-size:.85rem;margin-bottom:20px">只需設定一次，儲存在此裝置。</p>
    <div class="field"><label>Supabase URL</label><input id="cfg-url" placeholder="https://xxx.supabase.co（不要加 /rest/v1）"></div>
    <div class="field"><label>Supabase Anon Key</label><input id="cfg-key" placeholder="eyJ..."></div>
    <div class="field"><label>Teacher Token（自訂，老師專用）</label><input id="cfg-teacher" placeholder="my-secret-token"></div>
    <button class="btn btn-dark" onclick="saveConfig()">儲存並繼續</button>
    <div id="cfg-msg"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const CONFIG_KEY = 'gsatword_config';

function getConfig(){
  try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}'); }
  catch(e){ return {}; }
}

function saveConfig(){
  const url  = document.getElementById('cfg-url').value.trim().replace(/\/$/,'');
  const key  = document.getElementById('cfg-key').value.trim();
  const teacher = document.getElementById('cfg-teacher').value.trim();
  if(!url||!key){ showMsg('cfg-msg','請填寫 URL 和 Key','err'); return; }
  localStorage.setItem(CONFIG_KEY, JSON.stringify({url,key,teacher}));
  showMsg('cfg-msg','已儲存，重新載入…','ok');
  setTimeout(()=>location.reload(), 800);
}

function showMsg(id,text,type){
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent=text;
  el.className='msg msg-'+(type==='err'?'err':'ok');
}

// ── Supabase helpers ──────────────────────────────────────────────────────────
let SB_URL='', SB_KEY='';

async function sbFetch(path, opts={}){
  const res = await fetch(SB_URL+path, {
    headers: {'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY,
               'Content-Type':'application/json', 'Prefer':'return=representation',
               ...(opts.headers||{})},
    ...opts
  });
  if(!res.ok){ const t=await res.text(); throw new Error(t); }
  const text=await res.text();
  return text ? JSON.parse(text) : [];
}

async function sbGet(table, params=''){
  return sbFetch(`/rest/v1/${table}?${params}`);
}

async function sbPost(table, body){
  return sbFetch(`/rest/v1/${table}`, {method:'POST', body:JSON.stringify(body)});
}

async function sbPatch(table, filter, body){
  return sbFetch(`/rest/v1/${table}?${filter}`, {method:'PATCH', body:JSON.stringify(body),
    headers:{'Prefer':'return=representation'}});
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function today(){ return new Date().toISOString().slice(0,10); }
function plusDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ── State ─────────────────────────────────────────────────────────────────────
let mode = '';          // 'student' | 'teacher'
let studentId = '';
let studentToken = '';
let vocab = [];
let dueQueue = [];
let revIdx = 0;
let reviewActive = false;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const cfg = getConfig();
  const params = new URLSearchParams(location.search);
  const sToken = params.get('s');
  const tToken = params.get('teacher');

  // First time setup: no config
  if(!cfg.url || !cfg.key){
    hide('loading-screen');
    show('setup-screen');
    return;
  }

  SB_URL = cfg.url;
  SB_KEY = cfg.key;

  if(sToken){
    // Student mode
    mode = 'student';
    studentToken = sToken;
    await loadStudentView(sToken);
  } else if(tToken){
    // Teacher mode
    if(cfg.teacher && tToken !== cfg.teacher){
      hide('loading-screen');
      showError('存取被拒','Teacher token 不正確。');
      return;
    }
    mode = 'teacher';
    await loadTeacherView();
  } else {
    hide('loading-screen');
    showError('缺少連結參數','你的 URL 需要 ?s=TOKEN 或 ?teacher=TOKEN 參數。');
  }
}

function show(id,d){ document.getElementById(id).style.display=d||'block'; }
function hide(id){ document.getElementById(id).style.display='none'; }
function showError(title, msg){
  document.getElementById('err-title').textContent=title;
  document.getElementById('err-msg').textContent=msg;
  show('error-screen');
}

// ── Student View ──────────────────────────────────────────────────────────────
async function loadStudentView(token){
  try{
    const students = await sbGet('students', `token=eq.${encodeURIComponent(token)}&select=id,name`);
    if(!students.length){ hide('loading-screen'); showError('找不到學生','請確認你的連結是否正確。'); return; }
    const student = students[0];
    studentId = student.id;
    document.getElementById('name-badge').textContent = student.name;
    document.getElementById('name-badge').style.display = 'inline-block';

    await refreshVocab();
    hide('loading-screen');
    show('student-view');
    renderStats();
    initReview();
    setInterval(syncVocab, 30000);
  } catch(e){
    hide('loading-screen');
    showError('載入失敗', e.message);
  }
}

async function refreshVocab(){
  const rows = await sbGet('vocabulary',
    `student_id=eq.${studentId}&select=id,word,context,zh_meaning,context_zh,mastered,next_review,memo,marked&order=word`);
  const reviews = await sbGet('reviews',
    `vocab_id=in.(${rows.map(r=>`"${r.id}"`).join(',')})&select=vocab_id,result&order=reviewed_at.asc`);
  // Group reviews by vocab_id
  const revMap = {};
  for(const r of reviews){
    if(!revMap[r.vocab_id]) revMap[r.vocab_id]=[];
    revMap[r.vocab_id].push(r);
  }
  vocab = rows.map(r=>({
    ...r,
    reviews: revMap[r.id]||[],
    streak: consecutiveCorrect(revMap[r.id]||[])
  }));
}

async function syncVocab(){
  if(reviewActive) return;
  await refreshVocab();
  renderStats();
}

function consecutiveCorrect(reviews){
  let count=0;
  for(let i=reviews.length-1;i>=0;i--){
    if(reviews[i].result==='y') count++;
    else break;
  }
  return count;
}

function renderStats(){
  const t=today();
  const due=vocab.filter(e=>!e.mastered&&e.next_review<=t).length;
  const mastered=vocab.filter(e=>e.mastered).length;
  const total=vocab.length;
  const allR=vocab.flatMap(e=>e.reviews||[]);
  const acc=allR.length?Math.round(allR.filter(r=>r.result==='y').length/allR.length*100):0;
  document.getElementById('stats-row').innerHTML=
    `<div class="stat-box"><div class="val">${due}</div><div class="lbl">今日待複習</div></div>`+
    `<div class="stat-box"><div class="val">${mastered}</div><div class="lbl">已精熟</div></div>`+
    `<div class="stat-box"><div class="val">${total}</div><div class="lbl">總單字數</div></div>`+
    `<div class="stat-box"><div class="val">${acc}%</div><div class="lbl">歷史答對率</div></div>`;
}

function initReview(){
  reviewActive=false;
  const t=today();
  const pool=vocab.filter(e=>!e.mastered&&e.next_review<=t);
  const q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  dueQueue=q; revIdx=0; renderCard();
}

function renderCard(){
  const wrap=document.getElementById('rev-wrap');
  if(!dueQueue.length){
    reviewActive=false;
    const nxt=vocab.filter(e=>!e.mastered&&e.next_review).map(e=>e.next_review).sort()[0];
    wrap.innerHTML=`<div class="done-screen"><h2>🎉 今日複習完成！</h2><p>${nxt?'下次複習日期：'+nxt:'所有單字已精熟！'}</p></div>`;
    return;
  }
  if(revIdx>=dueQueue.length){
    reviewActive=false;
    const y=dueQueue.filter(e=>e._r==='y').length;
    const easy=dueQueue.filter(e=>e._r==='easy').length;
    const n=dueQueue.length-y-easy;
    wrap.innerHTML=`<div class="done-screen"><h2>✅ 複習完成</h2><p>認識 ${y} · 太簡單 ${easy} · 不認識 ${n}</p></div>`;
    return;
  }
  reviewActive=true;
  const e=dueQueue[revIdx];
  const hi=e.context
    ? e.context.replace(new RegExp('\\b'+escRe(e.word)+'\\b','gi'),m=>`<span class="whi">${esc(m)}</span>`)
    : `<span class="whi">${esc(e.word)}</span>（無例句）`;
  const zhBlock=(e.zh_meaning||e.context_zh)?`
    <div class="zh-hint">
      ${e.zh_meaning?`<div class="zh-meaning">${esc(e.zh_meaning)}</div>`:''}
      ${e.context_zh?`<div class="zh-context">${esc(e.context_zh)}</div>`:''}
    </div>`:'';
  wrap.innerHTML=`
    <div class="prog">${revIdx+1} / ${dueQueue.length}</div>
    <div class="flash-card">
      <div class="sentence">${hi}</div>
      ${zhBlock}
      <div class="rev-btns">
        <button class="btn-y" id="by" onclick="doReview('y')">認識 <kbd>Y</kbd></button>
        <button class="btn-n" id="bn" onclick="doReview('n')">不認識 <kbd>N</kbd></button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="card-sub-actions">
        <button class="sub-btn sub-btn-easy" onclick="cardTooEasy('${e.word.replace(/'/g,"\\'")}','${e.id}')">⚡ 太簡單</button>
      </div>
      <div class="memo-area">
        <textarea id="memo-input" placeholder="備忘（可留空）">${esc(e.memo||'')}</textarea>
        <div class="memo-row">
          <button class="sub-btn" onclick="saveMemo('${e.id}')">儲存備忘</button>
          <span id="memo-msg" class="memo-ok"></span>
        </div>
      </div>
    </div>`;
}

async function doReview(result){
  if(revIdx>=dueQueue.length) return;
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by) by.disabled=true; if(bn) bn.disabled=true;
  const e=dueQueue[revIdx]; e._r=result;
  const fb=document.getElementById('fb');

  // Calc next review
  const streak=consecutiveCorrect([...(e.reviews||[]),{result}]);
  const intervals={1:14,2:28,3:56};
  let nextRev, mastered=false;
  if(streak>=4){ nextRev=plusDays(today(),56); mastered=true; }
  else if(intervals[streak]){ nextRev=plusDays(today(),intervals[streak]); }
  else { nextRev=plusDays(today(),7); }

  if(fb){
    if(result==='y'){
      fb.textContent=mastered?'🎉 已精熟！':`下次複習：${nextRev}（連對 ${streak} 次）`;
      fb.style.color='#2e7d32';
    } else {
      fb.textContent=`下次複習：${nextRev}`;
      fb.style.color='#c62828';
    }
  }

  revIdx++;
  setTimeout(renderCard, 900);

  // Save to Supabase
  try{
    await sbPost('reviews', {vocab_id: e.id, reviewed_at: today(), result});
    await sbPatch('vocabulary', `id=eq.${e.id}`, {next_review: nextRev, mastered});
    // Update local vocab
    const vi=vocab.findIndex(v=>v.id===e.id);
    if(vi>=0){
      vocab[vi].next_review=nextRev;
      vocab[vi].mastered=mastered;
      vocab[vi].reviews=[...(vocab[vi].reviews||[]),{result}];
      vocab[vi].streak=streak;
    }
    renderStats();
  }catch(err){ console.error('save review failed',err); }
}

async function cardTooEasy(word, vocabId){
  const e=dueQueue[revIdx]; if(e) e._r='easy';
  const fb=document.getElementById('fb');
  if(fb){ fb.textContent='⚡ 已設為 30 天後複習'; fb.style.color='#2e7d32'; }
  revIdx++;
  setTimeout(renderCard, 900);
  try{
    const nextRev=plusDays(today(),30);
    await sbPost('reviews', {vocab_id: vocabId, reviewed_at: today(), result: 'too_easy'});
    await sbPatch('vocabulary', `id=eq.${vocabId}`, {next_review: nextRev, mastered: false});
    const vi=vocab.findIndex(v=>v.id===vocabId);
    if(vi>=0){ vocab[vi].next_review=nextRev; vocab[vi].mastered=false; }
    renderStats();
  }catch(err){ console.error('too-easy failed',err); }
}

async function saveMemo(vocabId){
  const input=document.getElementById('memo-input');
  if(!input) return;
  const memo=input.value.trim();
  try{
    await sbPatch('vocabulary', `id=eq.${vocabId}`, {memo});
    const vi=vocab.findIndex(v=>v.id===vocabId);
    if(vi>=0) vocab[vi].memo=memo;
    const msg=document.getElementById('memo-msg');
    if(msg){ msg.textContent='已儲存'; setTimeout(()=>{if(msg)msg.textContent='';},1500); }
  }catch(err){}
}

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key==='y'||e.key==='Y') doReview('y');
  if(e.key==='n'||e.key==='N') doReview('n');
});

// ── Teacher View ──────────────────────────────────────────────────────────────
async function loadTeacherView(){
  try{
    const students = await sbGet('students', 'select=id,name,token&order=name');
    const t=today();
    // Load vocab for all students
    const allVocab = await sbGet('vocabulary',
      'select=student_id,mastered,next_review&order=word');

    hide('loading-screen');
    show('teacher-view');

    const grid=document.getElementById('teacher-grid');
    const baseUrl=location.origin+location.pathname;
    grid.innerHTML=students.map(s=>{
      const sv=allVocab.filter(v=>v.student_id===s.id);
      const due=sv.filter(v=>!v.mastered&&v.next_review&&v.next_review<=t).length;
      const mastered=sv.filter(v=>v.mastered).length;
      const total=sv.length;
      const link=`${baseUrl}?s=${encodeURIComponent(s.token)}`;
      return `<div class="student-card" onclick="showStudentDetail('${s.id}','${esc(s.name)}')">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-stats">
          <span class="due">今日 ${due}</span>
          <span class="mastered">精熟 ${mastered}</span>
          <span>總 ${total}</span>
        </div>
        <div class="sc-token" style="display:flex;align-items:center;gap:6px;margin-top:8px">
          <a href="${link}" target="_blank" onclick="event.stopPropagation()" style="color:#1a0dab;font-size:.72rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${link}</a>
          <button class="sub-btn" style="flex-shrink:0;font-size:.72rem;padding:3px 10px" onclick="event.stopPropagation();copyLink('${link}',this)">複製</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    hide('loading-screen');
    showError('Teacher 載入失敗', e.message);
  }
}

async function showStudentDetail(sid, name){
  document.getElementById('teacher-overview').style.display='none';
  document.getElementById('teacher-detail').style.display='';
  document.getElementById('detail-title').textContent=name+' 的單字列表';
  document.getElementById('detail-tbody').innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:24px">載入中…</td></tr>';
  const t=today();
  const rows=await sbGet('vocabulary',
    `student_id=eq.${sid}&select=id,word,context,zh_meaning,mastered,next_review,first_seen&order=word`);
  if(!rows.length){
    document.getElementById('detail-tbody').innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:24px">尚無單字</td></tr>';
    return;
  }
  const ids=rows.map(r=>r.id).join(',');
  const reviews=await sbGet('reviews', `vocab_id=in.(${ids})&select=vocab_id,result&order=reviewed_at.asc`);
  const revMap={};
  for(const r of reviews){ if(!revMap[r.vocab_id])revMap[r.vocab_id]=[]; revMap[r.vocab_id].push(r); }

  document.getElementById('detail-tbody').innerHTML=rows.map(r=>{
    const streak=consecutiveCorrect(revMap[r.id]||[]);
    const badge=r.mastered?'<span class="badge bm">精熟</span>':
      r.next_review<=t?'<span class="badge bd">今日到期</span>':'<span class="badge bu">未來</span>';
    const ctx=r.context&&r.context.length>60?r.context.slice(0,60)+'…':r.context||'—';
    return `<tr>
      <td style="font-weight:600">${esc(r.word)}</td>
      <td class="ctx-cell" data-full="${esc(r.context||'')}" onclick="toggleTeacherCtx(this)">${esc(ctx)}</td>
      <td style="color:#666;font-size:.85rem">${esc(r.zh_meaning||'—')}</td>
      <td>${streak}</td>
      <td>${r.next_review||'—'}</td>
      <td>${r.first_seen||'—'}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');
}

function toggleTeacherCtx(td){
  td.classList.toggle('expanded');
  td.textContent=td.classList.contains('expanded')
    ?(td.dataset.full||'—')
    :(td.dataset.full&&td.dataset.full.length>60?td.dataset.full.slice(0,60)+'…':(td.dataset.full||'—'));
}

function showTeacherOverview(){
  document.getElementById('teacher-detail').style.display='none';
  document.getElementById('teacher-overview').style.display='';
}

function copyLink(link, btn){
  navigator.clipboard.writeText(link).then(()=>{
    const orig=btn.textContent;
    btn.textContent='已複製！';
    setTimeout(()=>btn.textContent=orig, 1500);
  });
}

async function addStudentPrompt(){
  const name = prompt('學生名稱（英數字、底線、連字號）：');
  if(!name) return;
  if(!/^[\w\-]+$/.test(name)){ alert('名稱只能包含英數字、底線、連字號。'); return; }
  try{
    const existing = await sbGet('students', `name=eq.${encodeURIComponent(name)}&select=id,token`);
    if(existing.length){ alert(`學生「${name}」已存在。`); return; }
    await sbPost('students', {name});
    alert(`已新增學生：${name}\n\n記得在本機跑 gsatword_register.py ${name} 建立本地資料夾。`);
    location.reload();
  }catch(e){
    alert('新增失敗：'+e.message);
  }
}
