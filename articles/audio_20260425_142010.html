<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Pack (2 articles)</title>
<style>
  body { font-family: Georgia, serif; max-width: 760px; margin: 0 auto; padding: 40px 20px; background: #fafafa; color: #222; line-height: 1.9; }
  .back { font-size: 0.9rem; margin-bottom: 24px; }
  .back a { color: #1a0dab; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .page { display: none; }
  .page.active { display: block; }
  .article-title { font-size: 1.15rem; color: #333; margin: 0 0 24px 0; font-weight: normal; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
  .player { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 20px; margin-bottom: 32px; }
  .player audio { width: 100%; }
  .article { font-size: 1.05rem; }
  .article p { margin: 0 0 1.4em 0; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
  .nav-btn { background: #222; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
  .nav-btn:hover { background: #444; }
  .indicator { text-align: center; font-size: 0.85rem; color: #888; margin-top: 12px; }
</style>
</head>
<body>
<div class="back"><a href="../index.html">&larr; Back to all articles</a></div>

<div id="page-1" class="page active">
  <h2 class="article-title">null</h2>
  
  <div class="article">

  </div>
  <div class="nav"><span></span><button class="nav-btn" onclick="goTo(2)">下一篇 &rarr;</button></div>
</div>

<div id="page-2" class="page">
  <h2 class="article-title">null</h2>
  
  <div class="article">

  </div>
  <div class="nav"><button class="nav-btn" onclick="goTo(1)">&larr; 上一篇</button><span></span></div>
</div>

<div class="indicator" id="indicator">1 / 2</div>

<script>
let current = 1;
const total = 2;
function goTo(n) {
  document.getElementById('page-' + current).classList.remove('active');
  document.getElementById('page-' + n).classList.add('active');
  current = n;
  document.getElementById('indicator').textContent = n + ' / ' + total;
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
