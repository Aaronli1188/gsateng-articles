<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gsatword</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh}

/* Header */
.hdr{background:#1a1a1a;color:#fff;padding:0 20px;display:flex;align-items:center;height:52px;gap:12px;position:sticky;top:0;z-index:20}
.hdr h1{font-size:.88rem;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.student-badge{background:#d32f2f;color:#fff;padding:3px 12px;border-radius:12px;font-size:.82rem;font-weight:700;letter-spacing:.04em;display:none}
.hdr-stats{display:flex;gap:16px;font-size:.75rem;color:#888;margin-left:auto;flex-wrap:wrap}
.hdr-stats span b{color:#fff}

/* Nav */
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 20px;position:sticky;top:52px;z-index:9;display:none}
.nav button{padding:11px 16px;border:none;background:none;cursor:pointer;font-size:.88rem;color:#888;border-bottom:2px solid transparent;font-family:inherit}
.nav button.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:600}

/* Content */
.main{padding:24px;max-width:1300px;margin:0 auto}
.panel{display:none}.panel.active{display:block}

/* Loading / Error */
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:.9rem;color:#aaa}
#error-screen{display:none;text-align:center;padding:80px 24px}
#error-screen h2{font-size:1.2rem;margin-bottom:10px}
#error-screen p{color:#888;font-size:.9rem}

/* Student view */
#student-view{display:none}

/* Review */
.rev-outer{max-width:800px;margin:0 auto}
.mode-bar{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
.rev-mode-btn{flex:1;padding:7px 10px;border:none;background:#fff;cursor:pointer;font-size:.82rem;color:#666;min-width:100px;font-family:inherit}
.rev-mode-btn.active{background:#1a1a1a;color:#fff}
.prog{text-align:center;color:#999;font-size:.82rem;margin-bottom:14px}
.flash-card{background:#fff;border-radius:10px;padding:36px 40px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sentence{font-size:1.2rem;line-height:2.1}
.whi{color:#d32f2f;font-weight:700}
.rev-btns{display:flex;gap:12px;margin-top:28px}
.btn-y,.btn-n{flex:1;padding:16px;border:none;border-radius:8px;cursor:pointer;font-size:1.05rem;font-weight:600;font-family:inherit}
.btn-y{background:#2e7d32;color:#fff}.btn-y:hover{background:#1b5e20}
.btn-n{background:#c62828;color:#fff}.btn-n:hover{background:#b71c1c}
.btn-y:disabled,.btn-n:disabled{opacity:.4;cursor:default;pointer-events:none}
.feedback{margin-top:12px;font-size:.88rem;text-align:center;min-height:20px}
.done{background:#fff;border-radius:10px;padding:48px 40px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.done h2{font-size:1.15rem;margin-bottom:10px}.done p{color:#888;font-size:.9rem}
.incognito-badge{display:inline-block;background:#7b1fa2;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.card-actions{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.act-btn{padding:6px 16px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.8rem;color:#555;font-weight:500;font-family:inherit}
.act-btn:hover{background:#f5f5f5}
.act-del{border-color:#ffcdd2;color:#c62828}.act-del:hover{background:#ffebee}
.act-easy{border-color:#c8e6c9;color:#2e7d32}.act-easy:hover{background:#e8f5e9}
.act-mark{border-color:#ffe0b2;color:#e65100}.act-mark:hover{background:#fff3e0}
.act-mark.marked{background:#fff3e0;border-color:#e65100}
.memo-area{margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0}
.memo-area textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:.82rem;font-family:inherit;resize:vertical;min-height:52px}
.memo-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.act-memo{border-color:#bbdefb;color:#1565c0}.act-memo:hover{background:#e3f2fd}
.memo-ok{font-size:.78rem;color:#2e7d32}
.zh-hint{margin:10px 0 6px;padding:10px 14px;background:#f5f5f5;border-radius:8px;border-left:3px solid #bdbdbd}
.zh-meaning{font-size:1rem;color:#333;font-weight:600;margin-bottom:4px}
.zh-context{font-size:.9rem;color:#666;font-style:italic}

/* Quiz date picker */
.quiz-dates{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.quiz-dates h4{font-size:.78rem;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.quiz-date-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qd-item{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid #ddd;border-radius:16px;background:#fff;cursor:pointer;font-size:.8rem;color:#555;user-select:none}
.qd-item.selected{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.quiz-start{padding:7px 20px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.84rem;font-weight:600;font-family:inherit}
.quiz-start:disabled{opacity:.4;cursor:default}

/* List */
.list-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:5px 13px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:.79rem;color:#666;font-family:inherit}
.fb.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.tbl-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 14px;text-align:left;font-size:.9rem;border-bottom:1px solid #f0f0f0;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#999;font-size:.73rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
tr.selected td{background:#f3f0ff}
.wc{font-weight:600}
.ctx{color:#777;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.exp-cell{color:#444;cursor:pointer;border-bottom:1px dashed #ccc;line-height:1.4}
.exp-cell:hover{color:#1a73e8}
.ctx.expanded{max-width:none;overflow:visible;white-space:normal;background:#fffde7;padding:4px 6px;border-radius:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.71rem;font-weight:600}
.bm{background:#e8f5e9;color:#2e7d32}
.bd{background:#fce4ec;color:#c62828}
.bu{background:#e3f2fd;color:#1565c0}
.sm{padding:3px 8px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.77rem;color:#555;margin-right:3px;font-family:inherit}
.sm:hover{background:#f5f5f5}
.sdel{color:#c62828;border-color:#ffcdd2}.sdel:hover{background:#ffebee}
.mark-icon{cursor:pointer;font-size:.95rem;opacity:.25;transition:opacity .15s}
.mark-icon.on{opacity:1}
input[type=checkbox]{cursor:pointer;width:15px;height:15px}
.rrow td{background:#fffde7!important}
.rform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rform input[type=date]{padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:.82rem}
.rc{background:#1a1a1a;color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:.78rem;font-family:inherit}
.rx{background:none;border:none;cursor:pointer;font-size:.78rem;color:#999;padding:5px 4px;font-family:inherit}

/* Bulk bar */
.bulk-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;color:#fff;padding:12px 24px;display:none;align-items:center;gap:16px;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.bulk-bar.visible{display:flex}
.bulk-count{font-size:.88rem;font-weight:600;margin-right:auto}
.bulk-btn{padding:7px 16px;border:1px solid #555;background:none;color:#fff;border-radius:6px;cursor:pointer;font-size:.83rem;font-family:inherit}
.bulk-btn:hover{background:#333}
.bulk-btn-del{border-color:#c62828;color:#ff8a80}.bulk-btn-del:hover{background:#b71c1c;color:#fff}
.bulk-btn-cancel{color:#888;border-color:#444}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:28px 32px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.modal h3{font-size:.95rem;margin-bottom:16px}
.modal label{display:block;font-size:.78rem;color:#888;margin-bottom:5px;font-weight:600;text-transform:uppercase}
.modal input{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:6px;font-size:.88rem;margin-bottom:14px;font-family:inherit}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit}
.modal-ok{background:#1a1a1a;color:#fff}
.modal-cancel{background:#f0f0f0;color:#555}

/* Forms */
.form-sec{background:#fff;border-radius:10px;padding:28px 32px;box-shadow:0 1px 4px rgba(0,0,0,.08);max-width:500px}
.form-sec h2{font-size:.92rem;font-weight:600;margin-bottom:20px;color:#444}
.field{margin-bottom:14px}
.field label{display:block;font-size:.75rem;color:#999;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:6px;font-size:.88rem;font-family:inherit}
.field textarea{min-height:64px;resize:vertical}
.btn-pri{background:#1a1a1a;color:#fff;border:none;padding:9px 22px;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit}
.btn-pri:hover{opacity:.85}
.msg-box{margin-top:12px;padding:9px 13px;border-radius:6px;font-size:.84rem}
.ok{background:#e8f5e9;color:#2e7d32}
.err{background:#ffebee;color:#c62828}
.info{background:#e3f2fd;color:#1565c0}
.stabs{display:flex;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:18px}
.stab{flex:1;padding:7px;border:none;background:#fff;cursor:pointer;font-size:.83rem;color:#666;font-family:inherit}
.stab.active{background:#1a1a1a;color:#fff}
.sync-log{margin-top:12px;font-size:.82rem;color:#666;white-space:pre-wrap;background:#f5f5f5;border-radius:7px;padding:10px 12px;display:none}

/* Teacher view */
#teacher-view{display:none}
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
.student-card{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .15s}
.student-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.12)}
.sc-name{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.sc-stats{display:flex;gap:10px;font-size:.8rem;color:#888;flex-wrap:wrap}
.sc-stats .due{color:#c62828;font-weight:700}
.sc-stats .mastered{color:#2e7d32;font-weight:600}
#teacher-detail{display:none}
.back-btn{background:none;border:none;cursor:pointer;font-size:.85rem;color:#555;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px;font-family:inherit}
.back-btn:hover{color:#1a1a1a}
.ctx-cell{color:#777;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ctx-cell.expanded{max-width:none;overflow:visible;white-space:normal;background:#fffde7;padding:4px 8px;border-radius:4px}
.act-btn-sm{padding:3px 10px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.75rem;color:#555;font-family:inherit}
.act-btn-sm.danger{border-color:#ffcdd2;color:#c62828}
.act-btn-sm.danger:hover{background:#ffebee}

/* Setup */
#setup-screen{display:none;max-width:480px;margin:60px auto}
#setup-screen h2{font-size:1.1rem;margin-bottom:20px}
.setup-field{margin-bottom:14px}
.setup-field label{display:block;font-size:.77rem;color:#999;margin-bottom:5px;font-weight:600;text-transform:uppercase}
.setup-field input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:.9rem;font-family:inherit}
.setup-card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.btn-dark{border:none;padding:10px 22px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;background:#1a1a1a;color:#fff;font-family:inherit}
.btn-dark:hover{background:#333}
.btn-outline{border:1px solid #ddd;padding:10px 22px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;background:#fff;color:#555;font-family:inherit}
.btn-outline:hover{background:#f5f5f5}
.cfg-msg{margin-top:10px;padding:9px 13px;border-radius:7px;font-size:.85rem}
.cfg-msg.err{background:#ffebee;color:#c62828}
.cfg-msg.ok{background:#e8f5e9;color:#2e7d32}
</style>
</head>
<body>

<div class="hdr">
  <h1>GSATWORD</h1>
  <button id="back-to-teacher" onclick="showTeacherOverview()" style="display:none;background:none;border:1px solid #555;color:#aaa;border-radius:5px;padding:3px 10px;font-size:.76rem;cursor:pointer;white-space:nowrap;font-family:inherit">← 所有學生</button>
  <button id="teacher-iv-btn" onclick="openIntervals()" style="display:none;background:none;border:1px solid #555;color:#aaa;border-radius:5px;padding:3px 10px;font-size:.76rem;cursor:pointer;white-space:nowrap;font-family:inherit">⚙ 複習間隔</button>
  <span id="student-badge" class="student-badge"></span>
  <div class="hdr-stats" id="hdr-stats"></div>
</div>

<div class="nav" id="main-nav">
  <button class="active" data-panel="review" onclick="switchPanel(this)">複習</button>
  <button data-panel="list" onclick="switchPanel(this)">單字列表</button>
  <button data-panel="add" onclick="switchPanel(this)">新增</button>
  <button data-panel="sync" onclick="switchPanel(this)">匯入</button>
  <button data-panel="stats" onclick="switchPanel(this)">統計</button>
</div>

<div id="loading-screen">載入中…</div>
<div id="error-screen">
  <h2 id="err-title">無效的連結</h2>
  <p id="err-msg">請確認你的專屬連結是否正確。</p>
</div>

<!-- ── Student view ──────────────────────────────────────────────────────── -->
<div id="student-view">
  <div class="main">

    <!-- Review -->
    <div id="panel-review" class="panel active">
      <div class="rev-outer">
        <div class="mode-bar">
          <button class="rev-mode-btn active" onclick="setRevMode('normal',this)">今日複習</button>
          <button class="rev-mode-btn" onclick="setRevMode('incognito',this)">全部練習（無痕）</button>
          <button class="rev-mode-btn" onclick="setRevMode('quiz',this)">測驗模式</button>
          <button class="rev-mode-btn" onclick="setRevMode('quiz_incognito',this)">測驗（無痕）</button>
        </div>
        <div id="quiz-picker" style="display:none">
          <div class="quiz-dates">
            <h4>選擇上課日期</h4>
            <div class="quiz-date-list" id="quiz-date-list"></div>
            <button class="quiz-start" id="quiz-start-btn" onclick="startQuiz()" disabled>開始測驗</button>
          </div>
        </div>
        <div id="rev-wrap"></div>
      </div>
    </div>

    <!-- List -->
    <div id="panel-list" class="panel">
      <div class="list-toolbar">
        <div class="filter-bar">
          <button class="fb active" onclick="setFilter('all',this)">全部</button>
          <button class="fb" onclick="setFilter('due',this)">今日到期</button>
          <button class="fb" onclick="setFilter('upcoming',this)">未來</button>
          <button class="fb" onclick="setFilter('mastered',this)">已精熟</button>
          <button class="fb" onclick="setFilter('marked',this)">🔖 已標記</button>
          <button class="fb" onclick="setFilter('memo',this)">📝 有備忘</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="width:36px"><input type="checkbox" id="chk-all" onclick="toggleAll(this)"></th>
            <th style="width:32px"></th>
            <th>單字</th><th>例句</th><th>解釋</th><th>連對</th><th>下次複習</th><th>加入日</th><th>狀態</th><th>操作</th>
          </tr></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Add -->
    <div id="panel-add" class="panel">
      <div class="form-sec">
        <h2>手動新增單字</h2>
        <div class="field"><label>單字</label><input id="a-word" type="text" placeholder="e.g. vault"></div>
        <div class="field"><label>例句（可留空）</label><textarea id="a-ctx" placeholder="The vault was opened in 2008..."></textarea></div>
        <div class="field"><label>上課日期</label><input id="a-date" type="date"></div>
        <div class="field"><label>第一次複習日期</label><input id="a-rev" type="date"></div>
        <button class="btn-pri" onclick="doAdd()">新增</button>
        <div id="add-msg"></div>
      </div>
    </div>

    <!-- Stats -->
    <div id="panel-stats" class="panel">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px">
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">每日複習量（最近 30 天）</p>
          <canvas id="chart-daily"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">每日答對率（最近 30 天）</p>
          <canvas id="chart-acc"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">單字累積數</p>
          <canvas id="chart-growth"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">未來 14 天待複習預測</p>
          <canvas id="chart-forecast"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">單字狀態分佈</p>
          <canvas id="chart-status" style="max-width:280px;margin:0 auto;display:block"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
          <p style="font-size:.78rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px">連對次數分佈</p>
          <canvas id="chart-streak"></canvas>
        </div>
      </div>
    </div>

    <!-- Sync -->
    <div id="panel-sync" class="panel">
      <div class="form-sec">
        <h2>匯入單字</h2>
        <div class="stabs">
          <button class="stab active" onclick="setSyncTab('url',this)">Google Doc URL</button>
          <button class="stab" onclick="setSyncTab('file',this)">.docx 上傳</button>
        </div>
        <div id="s-url-area">
          <div class="field"><label>Google Doc URL</label>
            <input id="s-url" type="text" placeholder="https://docs.google.com/document/d/...">
          </div>
        </div>
        <div id="s-file-area" style="display:none">
          <div class="field"><label>.docx 檔案</label><input id="s-file" type="file" accept=".docx"></div>
        </div>
        <div class="field"><label>上課日期</label><input id="s-date" type="date"></div>
        <div class="field"><label>第一次複習日期</label><input id="s-rev" type="date"></div>
        <div class="field" style="flex-direction:row;align-items:center;gap:10px">
          <input type="checkbox" id="s-autoexplain" style="width:auto;margin:0">
          <label for="s-autoexplain" style="margin:0;font-weight:400;cursor:pointer">匯入後自動用 AI 生成詳細解釋</label>
        </div>
        <button class="btn-pri" onclick="doSync()">匯入</button>
        <div class="sync-log" id="sync-log"></div>
        <div id="sync-msg"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const CONFIG_KEY = 'gsatword_config';
const DEFAULT_SB_URL = 'https://tfixkvvlcalsmjhphowv.supabase.co';
const DEFAULT_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmaXhrdnZsY2Fsc21qaHBob3d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDg3NTIsImV4cCI6MjA5NTYyNDc1Mn0.koKlWoXShhHR7G4ZxA0smCeXmwB6ULHGDEPVwKWnqM0';
const DEFAULT_TEACHER = 'aarongsateng';
function getConfig(){
  try{
    const cfg=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}');
    // Backfill defaults if not set
    if(!cfg.url) cfg.url=DEFAULT_SB_URL;
    if(!cfg.key) cfg.key=DEFAULT_SB_KEY;
    return cfg;
  }catch(e){return {url:DEFAULT_SB_URL,key:DEFAULT_SB_KEY};}
}
function saveConfig(){
  const url=document.getElementById('cfg-url').value.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  const key=document.getElementById('cfg-key').value.trim();
  const teacher=document.getElementById('cfg-teacher').value.trim();
  const ant=document.getElementById('cfg-ant').value.trim();
  if(!url||!key){showCfgMsg('請填寫 URL 和 Key','err');return;}
  localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key,teacher,ant}));
  showCfgMsg('已儲存，重新載入…','ok');
  setTimeout(()=>location.reload(),800);
}
function showCfgMsg(t,c){const e=document.getElementById('cfg-msg');e.textContent=t;e.className='cfg-msg '+c;}

// ── Supabase ──────────────────────────────────────────────────────────────────
let SB_URL='',SB_KEY='',ANT_KEY='';
async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+path,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  const text=await res.text();
  return text?JSON.parse(text):[];
}
async function sbGet(table,params=''){return sbFetch(`/rest/v1/${table}?${params}`);}
async function sbPost(table,body){return sbFetch(`/rest/v1/${table}`,{method:'POST',body:JSON.stringify(body)});}
async function sbPatch(table,filter,body){return sbFetch(`/rest/v1/${table}?${filter}`,{method:'PATCH',body:JSON.stringify(body),headers:{'Prefer':'return=representation'}});}
async function sbDelete(table,filter){return sbFetch(`/rest/v1/${table}?${filter}`,{method:'DELETE'});}

// ── Utils ─────────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10);}
function plusDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function consecutiveCorrect(reviews){let c=0;for(let i=reviews.length-1;i>=0;i--){if(reviews[i].result==='y')c++;else break;}return c;}

// ── State ─────────────────────────────────────────────────────────────────────
let mode=''; // 'student' | 'teacher'
let studentId='', vocab=[], dueQueue=[], revIdx=0;
let reviewMode='normal', listFilter='all', syncTab='url';
let selectedIds=new Set(), quizDates=new Set(), lastCheckedId=null;
let reviewActive=false, teacherCurrentSid='', teacherCurrentName='', lastImportIds=[];
let GLOBAL_INTERVALS={s0:7,s1:14,s2:28,s3:56,master_at:4,too_easy:30};
let INTERVALS={...GLOBAL_INTERVALS};

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const params=new URLSearchParams(location.search);
  const sToken=params.get('s'), tToken=params.get('teacher');
  const cfg=getConfig();
  // Student links always use defaults — never show setup screen
  if(sToken){ SB_URL=DEFAULT_SB_URL; SB_KEY=DEFAULT_SB_KEY; ANT_KEY=''; }
  else if(!cfg.url||!cfg.key){hide('loading-screen');show('setup-screen');return;}
  else { SB_URL=cfg.url; SB_KEY=cfg.key; ANT_KEY=cfg.ant||''; }
  try{
    const cfgRows=await sbGet('app_config','key=in.(anthropic_key,review_intervals)&select=key,value');
    for(const r of cfgRows){
      if(r.key==='anthropic_key') ANT_KEY=(r.value||'').trim();
      if(r.key==='review_intervals') try{const p=JSON.parse(r.value);GLOBAL_INTERVALS={...GLOBAL_INTERVALS,...p};INTERVALS={...GLOBAL_INTERVALS};}catch(e){}
    }
  }catch(e){}
  if(sToken){
    mode='student';
    await loadStudentView(sToken);
  } else if(tToken){
    const validTeacher=cfg.teacher||DEFAULT_TEACHER;
    if(tToken!==validTeacher){hide('loading-screen');showError('存取被拒','Teacher token 不正確。');return;}
    mode='teacher';
    await loadTeacherView();
  } else {
    hide('loading-screen');
    showError('缺少連結參數','你的 URL 需要 ?s=TOKEN 或 ?teacher=TOKEN 參數。');
  }
}
function show(id,d){document.getElementById(id).style.display=d||'block';}
function hide(id){document.getElementById(id).style.display='none';}
function showError(title,msg){document.getElementById('err-title').textContent=title;document.getElementById('err-msg').textContent=msg;show('error-screen');}

// ── Student view ──────────────────────────────────────────────────────────────
async function loadStudentView(token){
  try{
    const students=await sbGet('students',`token=eq.${encodeURIComponent(token)}&select=id,name`);
    if(!students.length){hide('loading-screen');showError('找不到學生','請確認你的連結是否正確。');return;}
    const student=students[0];
    studentId=student.id;
    document.getElementById('student-badge').textContent=student.name;
    document.getElementById('student-badge').style.display='inline-block';
    document.title=`gsatword · ${student.name}`;
    // Set default dates
    const t=today();
    ['a-date','s-date'].forEach(id=>{document.getElementById(id).value=t;});
    ['a-rev','s-rev'].forEach(id=>{document.getElementById(id).value=plusDays(t,7);});
    document.getElementById('bulk-reset-date').value=t;
    document.getElementById('a-date').addEventListener('change',e=>{document.getElementById('a-rev').value=plusDays(e.target.value,7);});
    document.getElementById('s-date').addEventListener('change',e=>{document.getElementById('s-rev').value=plusDays(e.target.value,7);});
    await loadStudentIntervals(student.id);
    await refreshVocab();
    hide('loading-screen');
    show('student-view');
    show('main-nav','flex');
    updateStats();
    initReview();
    setInterval(syncVocab,30000);
  }catch(e){hide('loading-screen');showError('載入失敗',e.message);}
}

async function refreshVocab(){
  const rows=await sbGet('vocabulary',`student_id=eq.${studentId}&select=id,word,context,zh_meaning,context_zh,mastered,next_review,first_seen,memo,marked&order=word`);
  if(!rows.length){vocab=[];return;}
  const ids=rows.map(r=>r.id);
  const reviews=await sbGet('reviews',`vocab_id=in.(${ids.join(',')})&select=vocab_id,result&order=reviewed_at.asc`);
  const revMap={};
  for(const r of reviews){if(!revMap[r.vocab_id])revMap[r.vocab_id]=[];revMap[r.vocab_id].push(r);}
  vocab=rows.map(r=>({...r,reviews:revMap[r.id]||[],streak:consecutiveCorrect(revMap[r.id]||[])}));
}

async function syncVocab(){
  if(reviewActive) return;
  await refreshVocab();
  updateStats();
  if(document.getElementById('panel-list').classList.contains('active')) updateList();
}

function updateStats(){
  const t=today();
  const due=vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review<=t).length;
  const mastered=vocab.filter(e=>e.mastered).length;
  const total=vocab.length;
  const allR=vocab.flatMap(e=>e.reviews||[]);
  const acc=allR.length?Math.round(allR.filter(r=>r.result==='y').length/allR.length*100):0;
  document.getElementById('hdr-stats').innerHTML=
    `<span>今日 <b>${due}</b></span><span>精熟 <b>${mastered}</b></span><span>總計 <b>${total}</b></span><span>答對率 <b>${acc}%</b></span>`;
}

// ── Panel switching ───────────────────────────────────────────────────────────
function switchPanel(btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const panel=btn.dataset.panel;
  document.getElementById('panel-'+panel).classList.add('active');
  if(panel==='review') initReview();
  if(panel==='list') updateList();
  if(panel==='stats') renderStats();
}

// ── Review ────────────────────────────────────────────────────────────────────
function setRevMode(m,btn){
  reviewMode=m;
  document.querySelectorAll('.rev-mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isQuiz=m==='quiz'||m==='quiz_incognito';
  document.getElementById('quiz-picker').style.display=isQuiz?'block':'none';
  if(isQuiz) renderQuizPicker(); else initReview();
}

function renderQuizPicker(){
  const dates=[...new Set(vocab.map(e=>e.first_seen).filter(Boolean))].sort().reverse();
  const list=document.getElementById('quiz-date-list');
  list.innerHTML=dates.map(d=>{
    const count=vocab.filter(e=>e.first_seen===d).length;
    const sel=quizDates.has(d)?'selected':'';
    return `<div class="qd-item ${sel}" onclick="toggleQuizDate(this,'${d}')">${d} <span style="opacity:.6">(${count}字)</span></div>`;
  }).join('')||'<span style="color:#aaa;font-size:.84rem">尚無任何單字</span>';
  document.getElementById('quiz-start-btn').disabled=quizDates.size===0;
}

function toggleQuizDate(el,d){
  if(quizDates.has(d)){quizDates.delete(d);el.classList.remove('selected');}
  else{quizDates.add(d);el.classList.add('selected');}
  document.getElementById('quiz-start-btn').disabled=quizDates.size===0;
}

function startQuiz(){
  const pool=vocab.filter(e=>quizDates.has(e.first_seen));
  const q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  dueQueue=q; revIdx=0;
  document.getElementById('quiz-picker').style.display='none';
  renderCard();
}

function initReview(){
  reviewActive=false;
  const isQuiz=reviewMode==='quiz'||reviewMode==='quiz_incognito';
  if(isQuiz){renderQuizPicker();return;}
  const t=today();
  const pool=reviewMode==='incognito'?[...vocab]:vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review<=t);
  const q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  dueQueue=q; revIdx=0; renderCard();
}

function renderCard(){
  const wrap=document.getElementById('rev-wrap');
  const incognito=reviewMode==='incognito'||reviewMode==='quiz_incognito';
  if(!dueQueue.length){
    reviewActive=false;
    const isQuiz=reviewMode==='quiz'||reviewMode==='quiz_incognito';
    if(isQuiz){wrap.innerHTML='<div class="done"><h2>沒有符合的單字</h2><p>選取的日期沒有任何單字。</p></div>';return;}
    if(incognito){wrap.innerHTML='<div class="done"><h2>沒有任何單字</h2><p>請先匯入單字。</p></div>';return;}
    const nxt=vocab.filter(e=>!e.mastered&&e.next_review).map(e=>e.next_review).sort()[0];
    wrap.innerHTML=`<div class="done"><h2>今日沒有待複習的單字</h2><p>${nxt?'下次複習日期：'+nxt:'所有單字已精熟！'}</p></div>`;
    return;
  }
  if(revIdx>=dueQueue.length){
    reviewActive=false;
    const y=dueQueue.filter(e=>e._r==='y').length;
    const easy=dueQueue.filter(e=>e._r==='easy').length;
    const n=dueQueue.length-y-easy;
    const note=incognito?'<p style="color:#7b1fa2;font-size:.82rem;margin-top:8px">進度未寫入</p>':'';
    wrap.innerHTML=`<div class="done"><h2>${incognito?'練習完成（無痕）':'複習完成'}</h2><p>認識 ${y} · 太簡單 ${easy} · 不認識 ${n}</p>${note}</div>`;
    return;
  }
  reviewActive=true;
  const e=dueQueue[revIdx];
  const hi=e.context
    ?e.context.replace(new RegExp('\\b'+escRe(e.word)+'\\b','gi'),m=>`<span class="whi">${esc(m)}</span>`)
    :`<span class="whi">${esc(e.word)}</span>（無例句）`;
  const modeLabel=reviewMode==='quiz'?'測驗':reviewMode==='quiz_incognito'?'測驗（無痕）':incognito?'無痕':'';
  const badge=modeLabel?`<span class="incognito-badge">${modeLabel}</span>`:'';
  const markCls=e.marked?'act-btn act-mark marked':'act-btn act-mark';
  const zhBlock=(e.zh_meaning||e.context_zh)?`<div class="zh-hint">${e.zh_meaning?`<div class="zh-meaning">${esc(e.zh_meaning)}</div>`:''} ${e.context_zh?`<div class="zh-context">${esc(e.context_zh)}</div>`:''}</div>`:'';
  wrap.innerHTML=`
    <div class="prog">${revIdx+1} / ${dueQueue.length}${badge}</div>
    <div class="flash-card">
      <div class="sentence">${hi}</div>
      ${zhBlock}
      <div class="rev-btns">
        <button class="btn-y" id="by" onclick="doReview('y')">認識 <kbd>Y</kbd></button>
        <button class="btn-n" id="bn" onclick="doReview('n')">不認識 <kbd>N</kbd></button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="card-actions">
        <button class="act-btn act-del" onclick="cardDelete('${e.id}','${esc(e.word)}')">🗑 刪除</button>
        <button class="act-btn act-easy" onclick="cardTooEasy('${e.id}','${esc(e.word)}')">⚡ 太簡單</button>
        <button class="${markCls}" id="mark-btn" onclick="cardMark('${e.id}','${esc(e.word)}')">🔖 ${e.marked?'已標記':'標記'}</button>
      </div>
      <div class="memo-area">
        <textarea id="memo-input" placeholder="備忘（可留空）">${esc(e.memo||'')}</textarea>
        <div class="memo-row">
          <button class="act-btn act-memo" onclick="saveMemo('${e.id}')">儲存備忘</button>
          <span id="memo-msg" class="memo-ok"></span>
        </div>
      </div>
    </div>`;
}

async function doReview(result){
  if(revIdx>=dueQueue.length) return;
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by) by.disabled=true; if(bn) bn.disabled=true;
  const e=dueQueue[revIdx]; e._r=result;
  const incognito=reviewMode==='incognito'||reviewMode==='quiz_incognito';
  const fb=document.getElementById('fb');
  if(!incognito){
    try{
      const streak=consecutiveCorrect([...(e.reviews||[]),{result}]);
      const ivMap={1:INTERVALS.s1,2:INTERVALS.s2,3:INTERVALS.s3};
      let nextRev,mastered=false;
      if(streak>=INTERVALS.master_at){nextRev=plusDays(today(),INTERVALS.s3);mastered=true;}
      else if(ivMap[streak]){nextRev=plusDays(today(),ivMap[streak]);}
      else{nextRev=plusDays(today(),INTERVALS.s0);}
      await sbPost('reviews',{vocab_id:e.id,reviewed_at:today(),result});
      await sbPatch('vocabulary',`id=eq.${e.id}`,{next_review:nextRev,mastered});
      const vi=vocab.findIndex(v=>v.id===e.id);
      if(vi>=0){vocab[vi].next_review=nextRev;vocab[vi].mastered=mastered;vocab[vi].reviews=[...(vocab[vi].reviews||[]),{result}];vocab[vi].streak=streak;}
      updateStats();
      if(fb){
        if(result==='y'){fb.textContent=mastered?'🎉 已精熟！':`下次複習：${nextRev}（連對 ${streak} 次）`;fb.style.color='#2e7d32';}
        else{fb.textContent=`下次複習：${nextRev}`;fb.style.color='#c62828';}
      }
    }catch(err){console.error(err);}
  } else {
    if(fb){fb.textContent=result==='y'?'✓（不計入進度）':'✗（不計入進度）';fb.style.color=result==='y'?'#7b1fa2':'#888';}
  }
  revIdx++;
  setTimeout(renderCard,900);
}

async function cardDelete(vid,word){
  if(!confirm(`確定刪除「${word}」這張卡片？`)) return;
  await sbDelete('vocabulary',`id=eq.${vid}`);
  dueQueue.splice(revIdx,1);
  const fb=document.getElementById('fb');
  if(fb){fb.textContent='已刪除';fb.style.color='#c62828';}
  await refreshVocab(); updateStats();
  setTimeout(renderCard,600);
}

async function cardTooEasy(vid,word){
  const incognito=reviewMode==='incognito'||reviewMode==='quiz_incognito';
  const e=dueQueue[revIdx]; if(e) e._r='easy';
  const fb=document.getElementById('fb');
  if(fb){fb.textContent=incognito?'⚡ 跳過（不計入進度）':'⚡ 已設為 30 天後複習';fb.style.color='#2e7d32';}
  revIdx++;
  setTimeout(renderCard,900);
  if(!incognito){
    try{
      const nextRev=plusDays(today(),INTERVALS.too_easy);

async function callAnthropic(messages, maxTokens=256){
  const key=SB_KEY||DEFAULT_SB_KEY;
  const base=(SB_URL||DEFAULT_SB_URL).replace(/\/+$/,'');
  const proxyUrl=base+'/functions/v1/ai-proxy?apikey='+key;
  console.log('[AI] URL=',proxyUrl.slice(0,80),'key_len=',key.length);
  const res=await fetch(proxyUrl,{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages})
  });
  if(!res.ok){const t=await res.text();throw new Error('AI proxy '+res.status+': '+t.slice(0,200));}
  return res.json();
}

async function generateExplanation(vid){
  const sidStr=String(vid);
  const e=vocab.find(v=>String(v.id)===sidStr); if(!e) return;
  const btn=document.getElementById('aibtn-'+esc(vid));
  if(btn){btn.textContent='…';btn.disabled=true;}
  const prompt='Word: "'+e.word+'"\nContext: "'+(e.context||'').replace(/"/g,"'").replace(/[\r\n]+/g,' ')+'"\n\nReply in exactly 3 lines, nothing else:\nZH: [concise Traditional Chinese definition, e.g. "（動詞）建立；設立"]\nCTX: [one sentence Traditional Chinese explaining the word in the given context]\nUSE: [one short English usage pattern, e.g. "insist on sth / that + clause"]';
  try{
    const data=await callAnthropic([{role:'user',content:prompt}]);
    const text=data.content?.[0]?.text||'';
    let zh='',ctx='',use='';
    for(const line of text.split('\n')){
      if(line.startsWith('ZH:')) zh=line.slice(3).trim();
      else if(line.startsWith('CTX:')) ctx=line.slice(4).trim();
      else if(line.startsWith('USE:')) use=line.slice(4).trim();
    }
    if(!zh) throw new Error('解析失敗：'+text);
    const ctxFull=ctx+(use?'\n用法：'+use:'');
    await sbPatch('vocabulary','id=eq.'+sidStr,{zh_meaning:zh,context_zh:ctxFull});
    const vi=vocab.findIndex(v=>String(v.id)===sidStr);
    if(vi!==-1){vocab[vi].zh_meaning=zh;vocab[vi].context_zh=ctxFull;}
    if(btn){btn.textContent='✨';btn.disabled=false;}
    updateList();
  }catch(err){
    if(btn){btn.textContent='✨';btn.disabled=false;}
    throw err;
  }
}

function toggleWord(evt,chk){
  const id=chk.dataset.id;
  const rows=filteredVocab();
  if(evt.shiftKey&&lastCheckedId){
    const ids=rows.map(e=>e.id);
    const i1=ids.indexOf(lastCheckedId), i2=ids.indexOf(id);
    if(i1!==-1&&i2!==-1){
      const lo=Math.min(i1,i2), hi=Math.max(i1,i2);
      for(let i=lo;i<=hi;i++){if(chk.checked)selectedIds.add(ids[i]);else selectedIds.delete(ids[i]);}
    }
  } else {
    if(chk.checked) selectedIds.add(id); else selectedIds.delete(id);
  }
  lastCheckedId=id;
  rows.forEach(e=>{
    const row=document.getElementById('row-'+esc(e.id));
    if(row) row.className=selectedIds.has(e.id)?'selected':'';
    const cb=row?.querySelector('input[type=checkbox]');
    if(cb) cb.checked=selectedIds.has(e.id);
  });
  updateBulkBar();
  document.getElementById('chk-all').checked=rows.length>0&&rows.every(e=>selectedIds.has(e.id));
}

async function doSync(){
  const cd=document.getElementById('s-date').value;
  const fr=document.getElementById('s-rev').value;
  if(!(ANT_KEY||'').trim()){showFormMsg('sync-msg','請先設定 Anthropic API Key（已自動從 Supabase 讀取，若未設定請聯絡老師）',false);return;}
  showSyncLog(''); showFormMsg('sync-msg','','info');
  let text='';
  if(syncTab==='url'){
    const urlVal=document.getElementById('s-url').value.trim();
    if(!urlVal){showFormMsg('sync-msg','請輸入 URL',false);return;}
    const m=urlVal.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(!m){showFormMsg('sync-msg','無效的 Google Docs 網址',false);return;}
    appendSyncLog('正在下載文章…');
    try{
      const r=await fetch(`https://docs.google.com/document/d/${m[1]}/export?format=txt`);
      if(!r.ok) throw new Error('下載失敗，請確認文件是否公開');
      text=await r.text();
      appendSyncLog(`下載完成（${text.length} 字元）`);
    }catch(e){showFormMsg('sync-msg','下載失敗：'+e.message,false);return;}
  } else {
    const file=document.getElementById('s-file').files[0];
    if(!file){showFormMsg('sync-msg','請選取 .docx 檔案',false);return;}
    appendSyncLog('正在解析 .docx…');
    try{
      const ab=await file.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:ab});
      text=result.value;
      appendSyncLog(`解析完成（${text.length} 字元）`);
    }catch(e){showFormMsg('sync-msg','解析失敗：'+e.message,false);return;}
  }
  appendSyncLog('正在用 Claude 擷取單字…');
  const existingWords=vocab.map(v=>v.word.toLowerCase());
  let extracted=[];
  try{
    const data=await callAnthropic([{role:'user',content:'從以下英文文章中擷取 B1-C1 程度的重要單字（不含常見基礎詞），每個單字提供：word, zh_meaning（中文意思，3字以內）, context（原文含單字的完整句子）, context_zh（例句中文翻譯）。以 JSON array 回傳，格式：[{"word":"...","zh_meaning":"...","context":"...","context_zh":"..."}]。只回傳 JSON，不要其他文字。\n\n文章：\n'+text.slice(0,6000)}],2000);
    const raw=data.content[0].text.trim();
    extracted=JSON.parse(raw.replace(/^```json\n?/,'').replace(/\n?```$/,''));
    appendSyncLog(`Claude 擷取了 ${extracted.length} 個單字`);
  }catch(e){showFormMsg('sync-msg','Claude 錯誤：'+e.message,false);return;}
  const newWords=extracted.filter(w=>!existingWords.includes(w.word.toLowerCase()));
  appendSyncLog(`其中 ${newWords.length} 個是新單字，開始匯入…`);
  let added=0; lastImportIds=[];
  for(const w of newWords){
    try{
      const rows=await sbPost('vocabulary',{student_id:studentId,word:w.word,zh_meaning:w.zh_meaning||'',context:w.context||'',context_zh:w.context_zh||'',first_seen:cd,next_review:fr});
      if(rows&&rows[0]&&rows[0].id) lastImportIds.push(rows[0].id);
      added++;
    }catch(e){appendSyncLog(`  略過「${w.word}」`);}
  }
  appendSyncLog(`完成！新增了 ${added} 個，跳過 ${extracted.length-newWords.length} 個已存在`);
  showFormMsg('sync-msg',`新增 ${added} 個，跳過 ${extracted.length-newWords.length} 個已存在`,true);
  if(lastImportIds.length){
    const b=document.getElementById('undo-banner');
    document.getElementById('undo-label').textContent=`本次匯入了 ${lastImportIds.length} 個單字`;
    b.style.display='flex';
  }
  await refreshVocab(); updateStats();
  // Auto-explain if checkbox checked
  if(document.getElementById('s-autoexplain').checked && lastImportIds.length && ANT_KEY){
    appendSyncLog(`開始為 ${lastImportIds.length} 個新單字生成 AI 解釋…`);
    let eIdx=0;
    for(const vid of lastImportIds){
      appendSyncLog(`  解釋 ${++eIdx}/${lastImportIds.length}：${vocab.find(v=>v.id===vid)?.word||vid}`);
      await generateExplanation(vid);
    }
    appendSyncLog('解釋生成完成！');
    updateList();
  }
}

    a.download=`gsatword_backup_${today()}.json`;
    a.click();
  }catch(e){alert('匯出失敗：'+e.message);}
}

async function restoreBackup(input){
  const file=input.files[0]; if(!file) return;
  input.value='';
  let data;
  try{ data=JSON.parse(await file.text()); }catch(e){alert('JSON 格式錯誤：'+e.message);return;}
  if(!data.students||!data.vocab){alert('備份格式不正確（缺少 students 或 vocab）');return;}
  if(!confirm(`確定回復備份？\n\n備份時間：${data.exported_at||'不明'}\n學生數：${data.students.length}\n單字數：${data.vocab.length}\n複習記錄：${(data.reviews||[]).length} 筆\n\n⚠️ 這會覆蓋 Supabase 中同名學生的資料（不會刪除備份中沒有的學生）。`)) return;
  try{
    // Upsert students (by name)
    for(const s of data.students){
      const ex=await sbGet('students',`name=eq.${encodeURIComponent(s.name)}&select=id`);
      if(!ex.length) await sbPost('students',{name:s.name});
    }
    // Build name→id map
    const dbStudents=await sbGet('students','select=id,name');
    const nameToId=Object.fromEntries(dbStudents.map(s=>[s.name,s.id]));
    // Upsert vocab
    for(const s of data.students){
      const sid=nameToId[s.name]; if(!sid) continue;
      const sVocab=data.vocab.filter(v=>v.student_id===s.id);
      for(const v of sVocab){
        const row={student_id:sid,word:v.word,context:v.context||'',zh_meaning:v.zh_meaning||'',
          context_zh:v.context_zh||'',mastered:!!v.mastered,next_review:v.next_review||null,
          first_seen:v.first_seen||null,memo:v.memo||'',marked:!!v.marked};
        await sbFetch(`/rest/v1/vocabulary?on_conflict=student_id,word`,{
          method:'POST',body:JSON.stringify(row),
          headers:{'Prefer':'return=representation,resolution=merge-duplicates'}
        });
      }
    }
    // Restore reviews (skip if already exist — best effort)
    if(data.reviews&&data.reviews.length){
      // Build old_vocab_id → new_vocab_id map
      const dbVocab=await sbGet('vocabulary','select=id,student_id,word');
      const oldVocabMap=Object.fromEntries(data.vocab.map(v=>[v.id,v]));
      const newVocabMap=Object.fromEntries(dbVocab.map(v=>[`${v.student_id}_${v.word}`,v.id]));
      const reviews=data.reviews.map(r=>{
        const ov=oldVocabMap[r.vocab_id]; if(!ov) return null;
        const ownerSid=nameToId[data.students.find(s=>s.id===ov.student_id)?.name];
        const newVid=newVocabMap[`${ownerSid}_${ov.word}`];
        if(!newVid) return null;
        return {vocab_id:newVid,reviewed_at:r.reviewed_at,result:r.result};
      }).filter(Boolean);
      for(let i=0;i<reviews.length;i+=200)
        await sbPost('reviews',reviews.slice(i,i+200));
    }
    alert('回復完成！');
    await loadTeacherView();
  }catch(e){alert('回復失敗：'+e.message);}
}

async function showStudentDetail(sid,name){
  teacherCurrentSid=sid;
  teacherCurrentName=name;
  studentId=sid;
  // Show student-view with nav, hide teacher-view
  hide('teacher-view');
  show('student-view');
  show('main-nav','flex');
  show('back-to-teacher');
  show('teacher-iv-btn');
  document.getElementById('student-badge').textContent=name;
  document.getElementById('student-badge').style.display='inline-block';
  // Hide 複習 and 統計 tabs for teacher
  document.querySelectorAll('.nav button').forEach(btn=>{
    if(btn.dataset.panel==='review'||btn.dataset.panel==='stats') btn.style.display='none';
    else btn.style.display='';
  });
  // Set dates
  const t=today();
  ['a-date','s-date'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=t;});
  ['a-rev','s-rev'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=plusDays(t,7);});
  // Activate list tab
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-list').classList.add('active');
  document.querySelector('.nav button[data-panel="list"]').classList.add('active');
  // Load student-specific intervals then data
  await loadStudentIntervals(sid);
  await refreshVocab();
  updateStats();
  updateList();
}

function showTeacherOverview(){
  hide('student-view');
  hide('main-nav');
  hide('back-to-teacher');
  document.getElementById('student-badge').style.display='none';
  document.getElementById('hdr-stats').innerHTML='';
  selectedIds.clear(); updateBulkBar();
  studentId=''; vocab=[]; teacherCurrentSid=''; teacherCurrentName='';
  INTERVALS={...GLOBAL_INTERVALS};
  hide('teacher-iv-btn');
  // Restore all nav tabs for next student
  document.querySelectorAll('.nav button').forEach(btn=>btn.style.display='');
  show('teacher-view');
}

// ── Review interval settings ──────────────────────────────────────────────────
async function loadStudentIntervals(sid){
  try{
    const rows=await sbGet('app_config',`key=eq.intervals_${sid}&select=value`);
    if(rows.length) INTERVALS={...GLOBAL_INTERVALS,...JSON.parse(rows[0].value)};
    else INTERVALS={...GLOBAL_INTERVALS};
  }catch(e){ INTERVALS={...GLOBAL_INTERVALS}; }
}
function openIntervals(){
  const isPerStudent=!!teacherCurrentSid;
  document.getElementById('iv-context').textContent=isPerStudent
    ?`目前：${teacherCurrentName} 個別設定（空白欄位用全域預設）`
    :'目前：全域預設（套用到無個別設定的學生）';
  document.getElementById('iv-s0').value=INTERVALS.s0;
  document.getElementById('iv-s1').value=INTERVALS.s1;
  document.getElementById('iv-s2').value=INTERVALS.s2;
  document.getElementById('iv-s3').value=INTERVALS.s3;
  document.getElementById('iv-easy').value=INTERVALS.too_easy;
  document.getElementById('iv-master').value=INTERVALS.master_at;
  document.getElementById('iv-msg').textContent='';
  document.getElementById('intervals-modal').classList.add('open');
}
function closeIntervals(){document.getElementById('intervals-modal').classList.remove('open');}
async function saveIntervals(){
  const s0=+document.getElementById('iv-s0').value;
  const s1=+document.getElementById('iv-s1').value;
  const s2=+document.getElementById('iv-s2').value;
  const s3=+document.getElementById('iv-s3').value;
  const easy=+document.getElementById('iv-easy').value;
  const master=+document.getElementById('iv-master').value;
  if([s0,s1,s2,s3,easy,master].some(v=>!v||v<1)){
    document.getElementById('iv-msg').textContent='所有欄位需大於 0'; return;
  }
  const val=JSON.stringify({s0,s1,s2,s3,master_at:master,too_easy:easy});
  const configKey=teacherCurrentSid?`intervals_${teacherCurrentSid}`:'review_intervals';
  try{
    // Upsert: PATCH first; if row missing, POST
    const existing=await sbGet('app_config',`key=eq.${configKey}&select=key`);
    if(existing.length){
      await sbFetch(`/rest/v1/app_config?key=eq.${configKey}`,{
        method:'PATCH',body:JSON.stringify({value:val}),
        headers:{'Prefer':'return=representation'}
      });
    } else {
      await sbPost('app_config',{key:configKey,value:val});
    }
    INTERVALS={s0,s1,s2,s3,master_at:master,too_easy:easy};
    if(!teacherCurrentSid) GLOBAL_INTERVALS={...INTERVALS};
    document.getElementById('iv-msg').textContent='已儲存！';
    setTimeout(closeIntervals,800);
  }catch(e){document.getElementById('iv-msg').textContent='儲存失敗：'+e.message;}
}

// ── Undo last import ──────────────────────────────────────────────────────────
async function undoLastImport(){
  if(!lastImportIds.length) return;
  if(!confirm(`確定復原本次匯入？將刪除 ${lastImportIds.length} 個單字。`)) return;
  await sbDelete('vocabulary',`id=in.(${lastImportIds.join(',')})`);
  lastImportIds=[];
  document.getElementById('undo-banner').style.display='none';
  showFormMsg('sync-msg','已復原本次匯入',true);
  await refreshVocab(); updateStats();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
let statsCharts={};

async function renderStats(){
  // Collect all reviews from vocab
  const allReviews=vocab.flatMap(v=>(v.reviews||[]).map(r=>({...r,reviewed_at:r.reviewed_at})));
  // For daily stats, fetch reviews with dates directly from Supabase
  let fullReviews=[];
  try{
    const ids=vocab.map(v=>v.id);
    if(ids.length){
      fullReviews=await sbGet('reviews',`vocab_id=in.(${ids.join(',')})&select=vocab_id,reviewed_at,result&order=reviewed_at.asc`);
    }
  }catch(e){}

  const t=today();

  // Last 30 days range
  const days30=[]; for(let i=29;i>=0;i--) days30.push(plusDays(t,-i));

  // Daily review counts and accuracy
  const dailyCount={}, dailyCorrect={}, dailyTotal={};
  for(const d of days30){dailyCount[d]=0;dailyCorrect[d]=0;dailyTotal[d]=0;}
  for(const r of fullReviews){
    const d=r.reviewed_at;
    if(dailyCount[d]!==undefined){
      dailyCount[d]++;
      dailyTotal[d]++;
      if(r.result==='y') dailyCorrect[d]++;
    }
  }
  const dailyAcc=days30.map(d=>dailyTotal[d]>0?Math.round(dailyCorrect[d]/dailyTotal[d]*100):null);
  const labels30=days30.map(d=>d.slice(5)); // MM-DD

  // Word growth (cumulative by first_seen)
  const byDate={};
  for(const v of vocab){
    const d=v.first_seen||t;
    byDate[d]=(byDate[d]||0)+1;
  }
  const growthDates=Object.keys(byDate).sort();
  let cum=0;
  const growthData=growthDates.map(d=>{cum+=byDate[d];return cum;});

  // Forecast: next 14 days
  const forecast=[];
  const fDays=[]; for(let i=0;i<14;i++) fDays.push(plusDays(t,i));
  for(const d of fDays){
    forecast.push(vocab.filter(v=>!v.mastered&&v.next_review===d).length);
  }

  // Status donut
  const mastered=vocab.filter(v=>v.mastered).length;
  const due=vocab.filter(v=>!v.mastered&&v.next_review&&v.next_review<=t).length;
  const upcoming=vocab.filter(v=>!v.mastered&&v.next_review&&v.next_review>t).length;

  // Streak distribution
  const streakBuckets={0:0,1:0,2:0,3:0,'4+':0};
  for(const v of vocab){
    const s=v.streak||0;
    if(s>=4) streakBuckets['4+']++;
    else streakBuckets[s]++;
  }

  // Destroy old charts
  Object.values(statsCharts).forEach(c=>c.destroy());
  statsCharts={};

  const mkChart=(id,type,labels,datasets,opts={})=>{
    const ctx=document.getElementById(id);
    if(!ctx) return;
    statsCharts[id]=new Chart(ctx,{type,data:{labels,datasets},options:{responsive:true,plugins:{legend:{display:datasets.length>1}},scales:type==='doughnut'?{}:{y:{beginAtZero:true},...(opts.scales||{})}}});
  };

  mkChart('chart-daily','bar',labels30,[{label:'複習數',data:days30.map(d=>dailyCount[d]),backgroundColor:'#1a1a1a88',borderRadius:4}]);
  mkChart('chart-acc','line',labels30,[{label:'答對率 %',data:dailyAcc,borderColor:'#2e7d32',backgroundColor:'#2e7d3222',tension:.3,spanGaps:true,fill:true}]);
  mkChart('chart-growth','line',growthDates.map(d=>d.slice(5)),[{label:'累積單字數',data:growthData,borderColor:'#1565c0',backgroundColor:'#1565c022',tension:.3,fill:true}]);
  mkChart('chart-forecast','bar',fDays.map(d=>d.slice(5)),[{label:'待複習',data:forecast,backgroundColor:'#c6282866',borderRadius:4}]);
  mkChart('chart-status','doughnut',['已精熟','今日到期','未來'],[{data:[mastered,due,upcoming],backgroundColor:['#2e7d32','#c62828','#1565c0']}]);
  mkChart('chart-streak','bar',['0次','1次','2次','3次','4+次'],[{label:'單字數',data:Object.values(streakBuckets),backgroundColor:'#7b1fa288',borderRadius:4}]);
}
