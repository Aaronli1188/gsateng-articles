<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSAT English Reading</title>
<style>
  body { font-family: Georgia, serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; background: #fafafa; }
  h1 { font-size: 1.8rem; color: #222; border-bottom: 2px solid #222; padding-bottom: 12px; }
  .article-list { list-style: none; padding: 0; }
  .article-list li { margin: 16px 0; }
  .article-list a { font-size: 1.1rem; color: #1a0dab; text-decoration: none; }
  .article-list a:hover { text-decoration: underline; }
  .meta { font-size: 0.85rem; color: #666; margin-top: 4px; }
  #loading { color: #888; font-size: 0.95rem; }
</style>
</head>
<body>
<h1>GSAT English Reading</h1>
<p id="loading">Loading articles...</p>
<ul class="article-list" id="list"></ul>
<script>
fetch('articles.json?v=' + Date.now())
  .then(r => r.json())
  .then(articles => {
    document.getElementById('loading').remove();
    const list = document.getElementById('list');
    articles.forEach(a => {
      const li = document.createElement('li');
      li.innerHTML = '<a href="' + a.url + '">' + a.title + '</a><div class="meta">' + a.date + '</div>';
      list.appendChild(li);
    });
  })
  .catch(() => {
    document.getElementById('loading').textContent = 'Could not load articles.';
  });
</script>
</body>
</html>
