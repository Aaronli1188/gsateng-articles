<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gsatword</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh}

/* Header */
.hdr{background:#1a1a1a;color:#fff;padding:0 20px;display:flex;align-items:center;height:52px;gap:12px;position:sticky;top:0;z-index:20}
.hdr h1{font-size:.88rem;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.student-badge{background:#d32f2f;color:#fff;padding:3px 12px;border-radius:12px;font-size:.82rem;font-weight:700;letter-spacing:.04em;display:none}
.hdr-stats{display:flex;gap:16px;font-size:.75rem;color:#888;margin-left:auto;flex-wrap:wrap}
.hdr-stats span b{color:#fff}

/* Nav */
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 20px;position:sticky;top:52px;z-index:9;display:none}
.nav button{padding:11px 16px;border:none;background:none;cursor:pointer;font-size:.88rem;color:#888;border-bottom:2px solid transparent;font-family:inherit}
.nav button.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:600}

/* Content */
.main{padding:24px;max-width:1300px;margin:0 auto}
.panel{display:none}.panel.active{display:block}

/* Loading / Error */
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:.9rem;color:#aaa}
#error-screen{display:none;text-align:center;padding:80px 24px}
#error-screen h2{font-size:1.2rem;margin-bottom:10px}
#error-screen p{color:#888;font-size:.9rem}

/* Student view */
#student-view{display:none}

/* Review */
.rev-outer{max-width:800px;margin:0 auto}
.mode-bar{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
.rev-mode-btn{flex:1;padding:7px 10px;border:none;background:#fff;cursor:pointer;font-size:.82rem;color:#666;min-width:100px;font-family:inherit}
.rev-mode-btn.active{background:#1a1a1a;color:#fff}
.prog{text-align:center;color:#999;font-size:.82rem;margin-bottom:14px}
.flash-card{background:#fff;border-radius:10px;padding:36px 40px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sentence{font-size:1.2rem;line-height:2.1}
.whi{color:#d32f2f;font-weight:700}
.rev-btns{display:flex;gap:12px;margin-top:28px}
.btn-y,.btn-n{flex:1;padding:16px;border:none;border-radius:8px;cursor:pointer;font-size:1.05rem;font-weight:600;font-family:inherit}
.btn-y{background:#2e7d32;color:#fff}.btn-y:hover{background:#1b5e20}
.btn-n{background:#c62828;color:#fff}.btn-n:hover{background:#b71c1c}
.btn-y:disabled,.btn-n:disabled{opacity:.4;cursor:default;pointer-events:none}
.feedback{margin-top:12px;font-size:.88rem;text-align:center;min-height:20px}
.done{background:#fff;border-radius:10px;padding:48px 40px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.done h2{font-size:1.15rem;margin-bottom:10px}.done p{color:#888;font-size:.9rem}
.incognito-badge{display:inline-block;background:#7b1fa2;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
.card-actions{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.act-btn{padding:6px 16px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.8rem;color:#555;font-weight:500;font-family:inherit}
.act-btn:hover{background:#f5f5f5}
.act-del{border-color:#ffcdd2;color:#c62828}.act-del:hover{background:#ffebee}
.act-easy{border-color:#c8e6c9;color:#2e7d32}.act-easy:hover{background:#e8f5e9}
.act-mark{border-color:#ffe0b2;color:#e65100}.act-mark:hover{background:#fff3e0}
.act-mark.marked{background:#fff3e0;border-color:#e65100}
.memo-area{margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0}
.memo-area textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:.82rem;font-family:inherit;resize:vertical;min-height:52px}
.memo-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.act-memo{border-color:#bbdefb;color:#1565c0}.act-memo:hover{background:#e3f2fd}
.memo-ok{font-size:.78rem;color:#2e7d32}
.zh-hint{margin:10px 0 6px;padding:10px 14px;background:#f5f5f5;border-radius:8px;border-left:3px solid #bdbdbd}
.zh-meaning{font-size:1rem;color:#333;font-weight:600;margin-bottom:4px}
.zh-context{font-size:.9rem;color:#666;font-style:italic}
.btn-reveal{display:block;width:60%;max-width:260px;padding:16px 0;margin:24px auto 0;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:1.1rem;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.02em;text-align:center}
.btn-reveal:hover{background:#333}
.sc-btn{width:42px;border:none;border-left:1px solid #ddd;background:#fff;cursor:pointer;font-size:1rem;color:#999;flex-shrink:0}
.sc-btn:hover{background:#f5f5f5;color:#333}
.sc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.sc-modal{background:#fff;border-radius:12px;padding:28px 24px;min-width:300px;max-width:400px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.sc-modal h3{font-size:1rem;font-weight:700;margin:0 0 16px;color:#1a1a1a}
.sc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0}
.sc-row:last-of-type{border-bottom:none}
.sc-label{flex:1;font-size:.9rem;color:#333}
.sc-key{display:inline-block;background:#f5f5f5;border:1px solid #ddd;border-radius:4px;padding:2px 10px;font-size:.82rem;font-family:monospace;min-width:44px;text-align:center}
.sc-edit{padding:5px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.sc-edit.listening{background:#e3f2fd;border-color:#1565c0;color:#1565c0}
.sc-close{display:block;width:100%;margin-top:18px;padding:9px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.88rem}

/* Quiz date picker */
.quiz-dates{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.quiz-dates h4{font-size:.78rem;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.quiz-date-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qd-item{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid #ddd;border-radius:16px;background:#fff;cursor:pointer;font-size:.8rem;color:#555;user-select:none}
.qd-item.selected{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.quiz-start{padding:7px 20px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.84rem;font-weight:600;font-family:inherit}
.quiz-start:disabled{opacity:.4;cursor:default}

/* List */
.list-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:5px 13px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:.79rem;color:#666;font-family:inherit}
.fb.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.tbl-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 14px;text-align:left;font-size:.9rem;border-bottom:1px solid #f0f0f0;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#999;font-size:.73rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
tr.selected td{background:#f3f0ff}
.wc{font-weight:600}
.ctx{color:#777;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.exp-cell{color:#444;cursor:pointer;border-bottom:1px dashed #ccc;line-height:1.4}
.exp-cell:hover{color:#1a73e8}
th.srt{cursor:pointer;user-select:none;white-space:nowrap}
th.srt:hover{background:#e8f0fe}
th.srt.srt-on{color:#1a73e8}
th.srt .si{font-size:.72em;opacity:.4;margin-left:2px}
th.srt.srt-on .si{opacity:1}
.ctx.expanded{max-width:none;overflow:visible;white-space:normal;background:#fffde7;padding:4px 6px;border-radius:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.71rem;font-weight:600}
.bm{background:#e8f5e9;color:#2e7d32}
.bd{background:#fce4ec;color:#c62828}
.bu{background:#e3f2fd;color:#1565c0}
.sm{padding:3px 8px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.77rem;color:#555;margin-right:3px;font-family:inherit}
.sm:hover{background:#f5f5f5}
.sdel{color:#c62828;border-color:#ffcdd2}.sdel:hover{background:#ffebee}
.mark-icon{cursor:pointer;font-size:.95rem;opacity:.25;transition:opacity .15s}
.mark-icon.on{opacity:1}
input[type=checkbox]{cursor:pointer;width:15px;height:15px}
.rrow td{background:#fffde7!important}
.rform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rform input[type=date]{padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:.82rem}
.rc{background:#1a1a1a;color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:.78rem;font-family:inherit}
.rx{background:none;border:none;cursor:pointer;font-size:.78rem;color:#999;padding:5px 4px;font-family:inherit}

/* Bulk bar */
.bulk-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;color:#fff;padding:12px 24px;display:none;align-items:center;gap:16px;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.bulk-bar.visible{display:flex}
.bulk-count{font-size:.88rem;font-weight:600;margin-right:auto}
.bulk-btn{padding:7px 16px;border:1px solid #555;background:none;color:#fff;border-radius:6px;cursor:pointer;font-size:.83rem;font-family:inherit}
.bulk-btn:hover{background:#333}
.bulk-btn-del{border-color:#c62828;color:#ff8a80}.bulk-btn-del:hover{background:#b71c1c;color:#fff}
.bulk-btn-cancel{color:#888;border-color:#444}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:28px 32px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.modal h3{font-size:.95rem;margin-bottom:16px}
.modal label{display:block;font-size:.78rem;color:#888;margin-bottom:5px;font-weight:600;text-transform:uppercase}
.modal input{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:6px;font-size:.88rem;margin-bottom:14px;font-family:inherit}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit}
.modal-ok{background:#1a1a1a;color:#fff}
.modal-cancel{background:#f0f0f0;color:#555}

/* Forms */
.form-sec{background:#fff;border-radius:10px;padding:28px 32px;box-shadow:0 1px 4px rgba(0,0,0,.08);max-width:500px}
.form-sec h2{font-size:.92rem;font-weight:600;margin-bottom:20px;color:#444}
.field{margin-bottom:14px}
.field label{display:block;font-size:.75rem;color:#999;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea{width:100%;padding:8px 11px;border:1px solid #ddd;border-radius:6px;font-size:.88rem;font-family:inherit}
.field textarea{min-height:64px;resize:vertical}
.btn-pri{background:#1a1a1a;color:#fff;border:none;padding:9px 22px;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit}
.btn-pri:hover{opacity:.85}
.btn-sec{background:#fff;color:#333;border:1px solid #ccc;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit}
.btn-sec:hover{background:#f5f5f5}
.btn-sec:disabled{opacity:.4;cursor:default}
.gen-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.msg-box{margin-top:12px;padding:9px 13px;border-radius:6px;font-size:.84rem}
.ok{background:#e8f5e9;color:#2e7d32}
.err{background:#ffebee;color:#c62828}
.info{background:#e3f2fd;color:#1565c0}
.stabs{display:flex;border:1px solid #ddd;border-radius:6px;overflow:hidden;margin-bottom:18px}
.stab{flex:1;padding:7px;border:none;background:#fff;cursor:pointer;font-size:.83rem;color:#666;font-family:inherit}
.stab.active{background:#1a1a1a;color:#fff}
.sync-log{margin-top:12px;font-size:.82rem;color:#666;white-space:pre-wrap;background:#f5f5f5;border-radius:7px;padding:10px 12px;display:none}

/* Teacher view */
#teacher-view{display:none}
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
.student-card{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .15s}
.student-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.12)}
.sc-name{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.sc-stats{display:flex;gap:10px;font-size:.8rem;color:#888;flex-wrap:wrap}
.sc-stats .due{color:#c62828;font-weight:700}
.sc-stats .mastered{color:#2e7d32;font-weight:600}
#teacher-detail{display:none}
.back-btn{background:none;border:none;cursor:pointer;font-size:.85rem;color:#555;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:5px;font-family:inherit}
.back-btn:hover{color:#1a1a1a}
.ctx-cell{color:#777;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ctx-cell.expanded{max-width:none;overflow:visible;white-space:normal;background:#fffde7;padding:4px 8px;border-radius:4px}
.act-btn-sm{padding:3px 10px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.75rem;color:#555;font-family:inherit}
.act-btn-sm.danger{border-color:#ffcdd2;color:#c62828}
.act-btn-sm.danger:hover{background:#ffebee}
/* Student activity */
.sc-status{display:flex;align-items:center;gap:6px;font-size:.78rem;margin:6px 0 4px}
.sc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sc-dot.green{background:#2e7d32}.sc-dot.yellow{background:#f57f17}.sc-dot.red{background:#c62828}
.sc-act-row{display:flex;align-items:center;gap:6px;margin-top:10px}
.sc-act-btn{padding:4px 10px;border:1px solid #ddd;border-radius:5px;background:#fff;font-size:.76rem;cursor:pointer;font-family:inherit}
.sc-act-btn:hover{background:#f5f5f5}
/* Activity modal */
.act-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.act-modal{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.act-modal h3{font-size:1.05rem;font-weight:700;margin:0 0 18px}
.act-section{margin-bottom:20px}
.act-section h4{font-size:.72rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.act-kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.act-kpi{flex:1;min-width:100px;background:#f9f9f9;border-radius:8px;padding:10px 12px;text-align:center}
.act-kpi .kv{font-size:1.4rem;font-weight:700;color:#1a1a1a}
.act-kpi .kl{font-size:.72rem;color:#888;margin-top:2px}
.heatmap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.hm-cell{aspect-ratio:1;border-radius:3px;cursor:default;position:relative}
.hm-cell:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:.68rem;white-space:nowrap;padding:3px 7px;border-radius:4px;pointer-events:none;z-index:10}
.session-list{font-size:.8rem;color:#555;line-height:1.9;max-height:140px;overflow-y:auto}

/* Setup */
#setup-screen{display:none;max-width:480px;margin:60px auto}
#setup-screen h2{font-size:1.1rem;margin-bottom:20px}
.setup-field{margin-bottom:14px}
.setup-field label{display:block;font-size:.77rem;color:#999;margin-bottom:5px;font-weight:600;text-transform:uppercase}
.setup-field input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:.9rem;font-family:inherit}
.setup-card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.btn-dark{border:none;padding:10px 22px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;background:#1a1a1a;color:#fff;font-family:inherit}
.btn-dark:hover{background:#333}
.btn-outline{border:1px solid #ddd;padding:10px 22px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;background:#fff;color:#555;font-family:inherit}
.btn-outline:hover{background:#f5f5f5}
.cfg-msg{margin-top:10px;padding:9px 13px;border-radius:7px;font-size:.85rem}
.cfg-msg.err{background:#ffebee;color:#c62828}
.cfg-msg.ok{background:#e8f5e9;color:#2e7d32}

/* ── Check-in modal ─────────────────────────────────────────────────── */
.ci-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px}
.ci-card{background:#111;border-radius:28px;padding:36px 28px 28px;width:100%;max-width:340px;text-align:center;color:#fff;position:relative;overflow:hidden;animation:ci-pop .35s cubic-bezier(.34,1.56,.64,1) forwards}
.ci-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,107,53,.18) 0%,transparent 70%);pointer-events:none}
.ci-fire{font-size:3.8rem;display:block;margin-bottom:4px;animation:ci-bounce .7s ease-in-out infinite alternate;filter:drop-shadow(0 0 12px rgba(255,160,0,.7))}
.ci-streak-num{font-size:5.5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#ff6b35 30%,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
.ci-streak-unit{font-size:1.1rem;font-weight:700;color:#ff9f3f;letter-spacing:.08em;margin-bottom:6px}
.ci-msg{font-size:.88rem;color:#aaa;margin:10px 0 20px;line-height:1.6;min-height:2.4em}
.ci-stats-row{display:flex;gap:12px;margin-bottom:22px}
.ci-stat{flex:1;background:#1e1e1e;border-radius:12px;padding:12px 8px}
.ci-stat-n{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ci-stat-l{font-size:.7rem;color:#666;margin-top:2px;letter-spacing:.04em}
.ci-calendar-wrap{margin-bottom:22px}
.ci-cal-title{font-size:.68rem;color:#555;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.ci-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ci-cal-hd{font-size:.6rem;color:#444;text-align:center;padding-bottom:3px}
.ci-cal-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#444;background:#1a1a1a}
.ci-cal-day.has-login{background:linear-gradient(135deg,#ff6b35,#ffd700);color:#000;font-weight:800}
.ci-cal-day.today{box-shadow:0 0 0 2px #ffd700;color:#ffd700}
.ci-cal-day.today.has-login{color:#000}
.ci-cal-day.empty{background:none}
.ci-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff6b35,#ffd700);color:#000;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.04em;box-shadow:0 4px 20px rgba(255,107,53,.4);transition:transform .1s,box-shadow .1s}
.ci-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,107,53,.5)}
.ci-btn:active{transform:translateY(0)}
.ci-milestone{position:absolute;top:12px;right:14px;background:linear-gradient(135deg,#ffd700,#ff6b35);color:#000;font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.04em}
/* confetti */
.ci-confetti-piece{position:fixed;width:8px;height:10px;border-radius:2px;top:-12px;pointer-events:none;animation:ci-confetti-fall linear forwards}
@keyframes ci-confetti-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes ci-pop{from{opacity:0;transform:scale(.75) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes ci-bounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.05)}}

/* ══════════════════════════════════════════════════════════════
   UI Redesign v2 — Light + Depth + Gamification
══════════════════════════════════════════════════════════════ */
:root{
  --acc:#7c3aed;--acc2:#a855f7;
  --acc-bg:#f5f3ff;--acc-light:#ede9fe;
  --yes1:#059669;--yes2:#10b981;
  --no1:#dc2626;--no2:#f87171;
  --card-sh:0 8px 32px rgba(124,58,237,.1),0 2px 8px rgba(0,0,0,.04);
  --r:20px;
}
body{background:linear-gradient(135deg,#f5f3ff 0%,#eff6ff 55%,#f0fdf4 100%);background-attachment:fixed}
.hdr{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);box-shadow:0 2px 16px rgba(79,38,196,.35)}
.hdr h1{background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.18em}
.student-badge{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.hdr-stats{color:#a78bfa}.hdr-stats span b{color:#c4b5fd}
.nav{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(124,58,237,.12)}
.nav button{font-size:.9rem;transition:color .15s}
.nav button.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.nav button:hover:not(.active){color:var(--acc)}

/* Flash card */
.flash-card{border-radius:var(--r);box-shadow:var(--card-sh);border:1px solid rgba(124,58,237,.09);transition:box-shadow .2s;padding:40px 44px}
.flash-card:hover{box-shadow:0 12px 44px rgba(124,58,237,.14),0 2px 8px rgba(0,0,0,.04)}
.sentence{font-size:1.3rem;line-height:2.3;color:#1e1b4b;letter-spacing:.01em}
.whi{background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;font-style:normal}
.prog{font-size:.88rem;color:var(--acc);font-weight:700;letter-spacing:.04em;margin-bottom:18px}

/* Progress bar */
.rpb-wrap{background:rgba(124,58,237,.08);border-radius:99px;height:7px;margin-bottom:20px;overflow:hidden}
.rpb{height:100%;background:linear-gradient(90deg,#7c3aed,#a855f7);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Difficulty badge */
.diff-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.05em;vertical-align:middle;margin-left:6px}
.diff-new{background:#e0e7ff;color:#3730a3}
.diff-hard{background:#fee2e2;color:#991b1b}
.diff-mid{background:#fef3c7;color:#92400e}
.diff-easy{background:#d1fae5;color:#065f46}

/* Reveal button */
.btn-reveal{background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:14px;font-size:1.05rem;box-shadow:0 4px 18px rgba(124,58,237,.38);transition:transform .1s,box-shadow .1s;width:72%;max-width:300px;padding:17px 0}
.btn-reveal:hover{background:linear-gradient(135deg,#6d28d9,#9333ea);transform:translateY(-2px);box-shadow:0 7px 22px rgba(124,58,237,.48)}
.btn-reveal:active{transform:translateY(0)}

/* Reveal section animation */
#reveal-section{animation:reveal-in .28s cubic-bezier(.34,1.2,.64,1) forwards}
@keyframes reveal-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* zh-hint */
.zh-hint{border-radius:12px;background:linear-gradient(135deg,rgba(124,58,237,.04),rgba(168,85,247,.04));border:1px solid rgba(124,58,237,.14);border-left:3px solid var(--acc);padding:14px 16px}
.zh-meaning{color:var(--acc);font-size:1.05rem;font-weight:700}
.zh-context{color:#6b7280}

/* 認識/不認識 */
.btn-y{background:linear-gradient(135deg,var(--yes1),var(--yes2));border-radius:14px;font-size:1.12rem;box-shadow:0 4px 16px rgba(5,150,105,.28);transition:transform .1s,box-shadow .1s}
.btn-y:hover{background:linear-gradient(135deg,#047857,#059669);transform:translateY(-2px);box-shadow:0 6px 22px rgba(5,150,105,.38)}
.btn-y:active{transform:translateY(0)}
.btn-n{background:linear-gradient(135deg,var(--no1),var(--no2));border-radius:14px;font-size:1.12rem;box-shadow:0 4px 16px rgba(220,38,38,.24);transition:transform .1s,box-shadow .1s}
.btn-n:hover{background:linear-gradient(135deg,#b91c1c,#dc2626);transform:translateY(-2px);box-shadow:0 6px 22px rgba(220,38,38,.34)}
.btn-n:active{transform:translateY(0)}
.rev-btns{gap:16px;margin-top:20px}

/* Done card */
.done{border-radius:var(--r);background:linear-gradient(135deg,#f5f3ff,#eff6ff);box-shadow:var(--card-sh);border:1px solid rgba(124,58,237,.1);padding:52px 44px}
.done h2{background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.4rem}
.done p{color:#6b7280;font-size:.95rem;margin-top:6px}

/* Action buttons */
.act-btn{border-radius:10px;transition:transform .1s,box-shadow .1s}
.act-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1)}

/* Filter pills */
.fb{border-radius:22px;font-size:.82rem;transition:all .15s}
.fb.active{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#7c3aed;color:#fff;box-shadow:0 2px 10px rgba(124,58,237,.3)}

/* Table */
.tbl-wrap{border-radius:16px;box-shadow:0 4px 24px rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.08)}
th{background:linear-gradient(135deg,#f5f3ff,#eff6ff)!important;color:var(--acc)!important}
tr:hover td{background:rgba(124,58,237,.025)}
.bm{background:#d1fae5;color:#065f46}
.bd{background:#fee2e2;color:#991b1b}
.bu{background:#e0e7ff;color:#3730a3}

/* Forms */
.form-sec{border-radius:var(--r);box-shadow:var(--card-sh);border:1px solid rgba(124,58,237,.07)}
.btn-pri{background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:10px;box-shadow:0 3px 12px rgba(124,58,237,.28);transition:transform .1s,box-shadow .1s}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(124,58,237,.38);opacity:1}
.field input,.field textarea{border-radius:9px;border-color:rgba(124,58,237,.2);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,58,237,.12)}

/* Mode bar */
.mode-bar{border-radius:12px;border-color:rgba(124,58,237,.15)}
.rev-mode-btn{font-size:.85rem;transition:all .15s}
.rev-mode-btn.active{background:linear-gradient(135deg,#7c3aed,#a855f7)}

/* Stabs */
.stab.active{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.stabs{border-radius:10px;border-color:rgba(124,58,237,.2)}

/* Teacher student cards */
.student-card{border-radius:16px;border:1px solid rgba(124,58,237,.1);transition:transform .15s,box-shadow .15s}
.student-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(124,58,237,.14)}

/* Setup */
.setup-card{border-radius:var(--r);box-shadow:var(--card-sh)}
.btn-dark{background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:10px;box-shadow:0 3px 12px rgba(124,58,237,.28)}
.btn-dark:hover{background:linear-gradient(135deg,#6d28d9,#9333ea)}

/* Quiz */
.quiz-dates{border-radius:14px;box-shadow:var(--card-sh);border:1px solid rgba(124,58,237,.08)}
.qd-item.selected{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#7c3aed}
.quiz-start{background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:9px;box-shadow:0 3px 12px rgba(124,58,237,.28)}
</style>
</head>
<body>

<div class="hdr">
  <h1>GSATWORD</h1>
  <button id="back-to-teacher" onclick="showTeacherOverview()" style="display:none;background:none;border:1px solid #555;color:#aaa;border-radius:5px;padding:3px 10px;font-size:.76rem;cursor:pointer;white-space:nowrap;font-family:inherit">← 所有學生</button>

<!-- ── Student view ──────────────────────────────────────────────────────── -->
<div id="student-view">
  <div class="main">

    <!-- Review -->
    <div id="panel-review" class="panel active">
      <div class="rev-outer">
        <div class="mode-bar">
          <button class="rev-mode-btn active" onclick="setRevMode('normal',this)">今日複習</button>
          <button class="rev-mode-btn" onclick="setRevMode('incognito',this)">全部練習（無痕）</button>
          <button class="rev-mode-btn" onclick="setRevMode('quiz',this)">選擇日期測驗</button>

        </div>
        <div id="quiz-picker" style="display:none">

    <!-- List -->

      <div class="list-toolbar">

            <th class="srt" onclick="setSortCol('mastered')">狀態<span class="si" id="si-mastered"></span></th>

        <div class="field"><label>例句（可留空，生成時自動填入）</label><textarea id="a-ctx" placeholder="The vault was opened in 2008..."></textarea></div>
        <div class="field"><label>解釋（可留空，生成時自動填入）</label><textarea id="a-zh" rows="2" placeholder="（動詞）建立；設立"></textarea></div>

        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">

          <canvas id="chart-growth"></canvas>
        </div>
        <div style="background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)">

let SB_URL='',SB_KEY='',ANT_KEY='';
async function sbFetch(path,opts={}){
  const _key=SB_KEY||DEFAULT_SB_KEY;
  const _url=SB_URL||DEFAULT_SB_URL;
  const sep=path.includes('?')?'&':'?';
  const {headers:_h,..._rest}=opts;
  const res=await fetch(_url+path+sep+'apikey='+_key,{
    headers:{'Content-Type':'application/json','Prefer':'return=representation',...(_h||{})},
    ..._rest
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  const text=await res.text();
  return text?JSON.parse(text):[];
}
async function sbGet(table,params=''){return sbFetch(`/rest/v1/${table}?${params}`);}
async function sbPost(table,body){return sbFetch(`/rest/v1/${table}`,{method:'POST',body:JSON.stringify(body)});}
async function sbPatch(table,filter,body){return sbFetch(`/rest/v1/${table}?${filter}`,{method:'PATCH',body:JSON.stringify(body),headers:{'Prefer':'return=representation'}});}
async function sbDelete(table,filter){return sbFetch(`/rest/v1/${table}?${filter}`,{method:'DELETE'});}

// ── Utils ─────────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10);}
function plusDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function consecutiveCorrect(reviews){let c=0;for(let i=reviews.length-1;i>=0;i--){if(reviews[i].result==='y')c++;else break;}return c;}

// ── FSRS-4.5 ──────────────────────────────────────────────────────────────────
// grade: 1=Again(N), 3=Good(Y), 4=Easy(太簡單)
// stability = days until 90% retention; interval ≈ stability
const _FW=[0.4072,1.1829,3.1262,15.4722,7.2102,0.5316,1.0651,0.0589,1.5330,0.1544,1.0071,1.9936,0.1100,0.2900,2.2700,0.1400,2.9898];
const _FDK=-0.5, _FFC=19/81; // DECAY, FACTOR
function _fR(t,s){return Math.pow(1+_FFC*t/Math.max(s,0.1),_FDK);}
function _fS0(g){return Math.max(_FW[g-1],0.1);}
function _fD0(g){return Math.min(Math.max(_FW[4]-Math.exp(_FW[5]*(g-1))+1,1),10);}
function _fSrecall(d,s,r,g){
  const hp=g===2?_FW[15]:1, eb=g===4?_FW[16]:1;
  return s*(Math.exp(_FW[8])*(11-d)*Math.pow(s,-_FW[9])*(Math.exp(_FW[10]*(1-r))-1)*hp*eb+1);
}
function _fSforget(d,s,r){return _FW[11]*Math.pow(d,-_FW[12])*(Math.pow(s+1,_FW[13])-1)*Math.exp(_FW[14]*(1-r));}
function _fDnext(d,g){
  const nd=d-_FW[6]*(g-3);
  return Math.min(Math.max(_FW[7]*_fD0(4)+(1-_FW[7])*nd,1),10);
}
function fsrsInterval(s){return Math.max(1,Math.round(s/Math.pow(0.9,1/_FDK)-s/_FFC*0+s));}
// simplified: interval = round(s) because at t=S, R=0.9 exactly
function fsrsSchedule(card,grade,elapsedDays){
  const reps=card.sm_reps||0;
  let s,d;
  if(reps===0||card.sm_stability==null){
    s=_fS0(grade); d=_fD0(grade);
  } else {
    s=card.sm_stability; d=card.sm_difficulty||_fD0(3);
    const r=_fR(elapsedDays,s);
    s=grade===1?_fSforget(d,s,r):_fSrecall(d,s,r,grade);
    d=_fDnext(d,grade);
    s=Math.max(s,0.1); d=Math.min(Math.max(d,1),10);
  }
  const interval=Math.max(1,Math.round(s));
  return {sm_stability:s,sm_difficulty:d,sm_reps:reps+1,interval,mastered:interval>=90};
}
function fsrsElapsed(card){
  const rv=card.reviews||[];
  if(!rv.length) return 0;
  const last=rv[rv.length-1].reviewed_at;
  if(!last) return 0;
  return Math.max(0,Math.round((new Date(today())-new Date(last))/86400000));
}
// Replay review history to backfill FSRS state for legacy cards
function fsrsMigrateCard(card){
  const rv=(card.reviews||[]).filter(r=>r.reviewed_at);
  if(!rv.length) return null;
  let st={sm_stability:null,sm_difficulty:null,sm_reps:0};
  let prevDate=null;
  for(const r of rv){
    const grade=r.result==='y'?3:r.result==='too_easy'?4:1;
    const elapsed=prevDate?Math.max(0,Math.round((new Date(r.reviewed_at)-new Date(prevDate))/86400000)):0;
    const sched=fsrsSchedule(st,grade,elapsed);
    st={sm_stability:sched.sm_stability,sm_difficulty:sched.sm_difficulty,sm_reps:sched.sm_reps};
    prevDate=r.reviewed_at;
  }
  return st;
}
async function fsrsBumpOverdue(){
  const t=today();
  const overdue=vocab.filter(v=>!v.mastered&&v.next_review&&v.next_review<t);
  for(const v of overdue){
    try{
      await sbPatch('vocabulary',`id=eq.${v.id}`,{next_review:t});
      const vi=vocab.findIndex(x=>x.id===v.id);
      if(vi>=0) vocab[vi].next_review=t;
    }catch(e){}
  }
}
async function fsrsMigrateOldCards(){
  const toMigrate=vocab.filter(v=>(!v.sm_reps||v.sm_reps===0)&&v.sm_stability==null&&(v.reviews||[]).length>0);
  if(!toMigrate.length) return;
  const updates=[];
  for(const card of toMigrate){
    const st=fsrsMigrateCard(card);
    if(!st) continue;
    const vi=vocab.findIndex(v=>v.id===card.id);
    if(vi>=0) Object.assign(vocab[vi],st);
    updates.push({id:card.id,...st});
  }
  // DB writes in background
  for(const u of updates){
    try{await sbPatch('vocabulary',`id=eq.${u.id}`,{sm_stability:u.sm_stability,sm_difficulty:u.sm_difficulty,sm_reps:u.sm_reps});}
    catch(e){}
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const params=new URLSearchParams(location.search);
  const sToken=params.get('s'), tToken=params.get('teacher');
  const cfg=getConfig();
  // Student links always use defaults — never show setup screen
  if(sToken){ SB_URL=DEFAULT_SB_URL; SB_KEY=DEFAULT_SB_KEY; ANT_KEY=''; }
  else if(!cfg.url||!cfg.key){hide('loading-screen');show('setup-screen');return;}
  else { SB_URL=cfg.url; SB_KEY=cfg.key; ANT_KEY=cfg.ant||''; }
  try{
    const cfgRows=await sbGet('app_config','key=in.(anthropic_key,review_intervals)&select=key,value');
    for(const r of cfgRows){
      if(r.key==='anthropic_key') ANT_KEY=(r.value||'').trim();
      if(r.key==='review_intervals') try{const p=JSON.parse(r.value);GLOBAL_INTERVALS={...GLOBAL_INTERVALS,...p};INTERVALS={...GLOBAL_INTERVALS};}catch(e){}
    }
  }catch(e){}
  if(sToken){
    mode='student';
    await loadStudentView(sToken);
  } else if(tToken){
    const validTeacher=cfg.teacher||DEFAULT_TEACHER;
    if(tToken!==validTeacher){hide('loading-screen');showError('存取被拒','Teacher token 不正確。');return;}
    mode='teacher';
    await loadTeacherView();
  } else {
    hide('loading-screen');
    showError('缺少連結參數','你的 URL 需要 ?s=TOKEN 或 ?teacher=TOKEN 參數。');
  }
}

function hide(id){document.getElementById(id).style.display='none';}
function showError(title,msg){document.getElementById('err-title').textContent=title;document.getElementById('err-msg').textContent=msg;show('error-screen');}

// ── Student view ──────────────────────────────────────────────────────────────
async function loadStudentView(token){
  try{
    const students=await sbGet('students',`token=eq.${encodeURIComponent(token)}&select=id,name`);
    if(!students.length){hide('loading-screen');showError('找不到學生','請確認你的連結是否正確。');return;}
    const student=students[0];
    studentId=student.id;
    document.getElementById('student-badge').textContent=student.name;
    document.getElementById('student-badge').style.display='inline-block';
    document.title=`gsatword · ${student.name}`;
    // Set default dates
    const t=today();
    ['a-date','s-date'].forEach(id=>{document.getElementById(id).value=t;});
    ['a-rev','s-rev'].forEach(id=>{document.getElementById(id).value=plusDays(t,7);});
    document.getElementById('bulk-reset-date').value=t;
    document.getElementById('a-date').addEventListener('change',e=>{document.getElementById('a-rev').value=plusDays(e.target.value,7);});
    document.getElementById('s-date').addEventListener('change',e=>{document.getElementById('s-rev').value=plusDays(e.target.value,7);});
    await loadStudentIntervals(student.id);
    await refreshVocab();
    fsrsMigrateOldCards(); // 背景補齊舊卡 FSRS 狀態，不擋 UI
    fsrsBumpOverdue();     // 過期卡 next_review 更新為今天
    sbPost('student_sessions',{student_id:studentId}).catch(()=>{}); // 記錄登入
    showCheckinModal(student.id).catch(()=>{});
    hide('loading-screen');
    show('student-view');
    show('main-nav','flex');
    updateStats();
    initReview();
    setInterval(syncVocab,30000);
  }catch(e){hide('loading-screen');showError('載入失敗',e.message);}
}

async function refreshVocab(){
  const rows=await sbGet('vocabulary',`student_id=eq.${studentId}&select=id,word,context,zh_meaning,context_zh,mastered,next_review,first_seen,memo,marked,sm_stability,sm_difficulty,sm_reps&order=word`);
  if(!rows.length){vocab=[];return;}
  const ids=rows.map(r=>r.id);
  const reviews=await sbGet('reviews',`vocab_id=in.(${ids.join(',')})&select=vocab_id,result,reviewed_at&order=reviewed_at.asc`);
  const revMap={};
  for(const r of reviews){if(!revMap[r.vocab_id])revMap[r.vocab_id]=[];revMap[r.vocab_id].push(r);}
  vocab=rows.map(r=>({...r,reviews:revMap[r.id]||[],streak:consecutiveCorrect(revMap[r.id]||[])}));
}

async function syncVocab(){
  if(reviewActive) return;
  await refreshVocab();
  updateStats();
  if(document.getElementById('panel-list').classList.contains('active')) updateList();
}

function updateStats(){
  const t=today();
  const due=vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review<=t).length;
  const mastered=vocab.filter(e=>e.mastered).length;
  const total=vocab.length;
  const allR=vocab.flatMap(e=>e.reviews||[]);
  const acc=allR.length?Math.round(allR.filter(r=>r.result==='y').length/allR.length*100):0;
  document.getElementById('hdr-stats').innerHTML=
    `<span>今日 <b>${due}</b></span><span>精熟 <b>${mastered}</b></span><span>總計 <b>${total}</b></span><span>答對率 <b>${acc}%</b></span>`;
}

// ── Panel switching ───────────────────────────────────────────────────────────
function switchPanel(btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const panel=btn.dataset.panel;
  document.getElementById('panel-'+panel).classList.add('active');
  if(panel==='review') initReview();
  if(panel==='list') updateList();
  if(panel==='stats') renderStats();
}

// ── Review ────────────────────────────────────────────────────────────────────
function setRevMode(m,btn){
  reviewMode=m;
  document.querySelectorAll('.rev-mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isQuiz=m==='quiz';
  document.getElementById('quiz-picker').style.display=isQuiz?'block':'none';
  if(isQuiz) renderQuizPicker(); else initReview();
}

function renderQuizPicker(){
  const dates=[...new Set(vocab.map(e=>e.first_seen).filter(Boolean))].sort().reverse();
  const list=document.getElementById('quiz-date-list');
  list.innerHTML=dates.map(d=>{
    const count=vocab.filter(e=>e.first_seen===d).length;
    const sel=quizDates.has(d)?'selected':'';
    return `<div class="qd-item ${sel}" onclick="toggleQuizDate(this,'${d}')">${d} <span style="opacity:.6">(${count}字)</span></div>`;
  }).join('')||'<span style="color:#aaa;font-size:.84rem">尚無任何單字</span>';
  document.getElementById('quiz-start-btn').disabled=quizDates.size===0;
}

function toggleQuizDate(el,d){
  if(quizDates.has(d)){quizDates.delete(d);el.classList.remove('selected');}
  else{quizDates.add(d);el.classList.add('selected');}
  document.getElementById('quiz-start-btn').disabled=quizDates.size===0;
}

function startQuiz(){
  const pool=vocab.filter(e=>quizDates.has(e.first_seen));
  const q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  dueQueue=q; revIdx=0;
  document.getElementById('quiz-picker').style.display='none';
  renderCard();
}

function initReview(){
  reviewActive=false;
  const isQuiz=reviewMode==='quiz';
  if(isQuiz){renderQuizPicker();return;}
  const t=today();
  const pool=reviewMode==='incognito'?[...vocab]:vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review<=t);
  const q=[...pool];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  dueQueue=q; revIdx=0; renderCard();
}

function renderCard(){
  const wrap=document.getElementById('rev-wrap');
  const incognito=reviewMode==='incognito'||reviewMode==='quiz';
  if(!dueQueue.length){
    reviewActive=false;
    const isQuiz=reviewMode==='quiz';
    if(isQuiz){wrap.innerHTML='<div class="done"><h2>沒有符合的單字</h2><p>選取的日期沒有任何單字。</p></div>';return;}
    if(incognito){wrap.innerHTML='<div class="done"><h2>沒有任何單字</h2><p>請先匯入單字。</p></div>';return;}
    const nxt=vocab.filter(e=>!e.mastered&&e.next_review).map(e=>e.next_review).sort()[0];
    wrap.innerHTML=`<div class="done"><h2>今日沒有待複習的單字</h2><p>${nxt?'下次複習日期：'+nxt:'所有單字已精熟！'}</p></div>`;
    return;
  }
  if(revIdx>=dueQueue.length){
    reviewActive=false;
    const y=dueQueue.filter(e=>e._r==='y').length;
    const easy=dueQueue.filter(e=>e._r==='easy').length;
    const n=dueQueue.length-y-easy;
    const note=incognito?'<p style="color:#7b1fa2;font-size:.82rem;margin-top:8px">進度未寫入</p>':'';
    wrap.innerHTML=`<div class="done"><h2>${reviewMode==='quiz'?'測驗完成':incognito?'練習完成（無痕）':'複習完成'}</h2><p>認識 ${y} · 太簡單 ${easy} · 不認識 ${n}</p>${note}</div>`;
    return;
  }
  reviewActive=true;
  const e=dueQueue[revIdx];
  const hi=e.context
    ?e.context.replace(new RegExp('\\b'+escRe(e.word)+'\\b','gi'),m=>`<span class="whi">${esc(m)}</span>`)
    :`<span class="whi">${esc(e.word)}</span>（無例句）`;
  const modeLabel=reviewMode==='quiz'?'選擇日期測驗':incognito?'無痕':'';
  const badge=modeLabel?`<span class="incognito-badge">${modeLabel}</span>`:'';
  const markCls=e.marked?'act-btn act-mark marked':'act-btn act-mark';
  const zhBlock=(e.zh_meaning||e.context_zh)?`<div class="zh-hint">${e.zh_meaning?`<div class="zh-meaning">${esc(e.zh_meaning)}</div>`:''} ${e.context_zh?`<div class="zh-context">${esc(e.context_zh)}</div>`:''}</div>`:'<div class="zh-hint" style="color:#bbb;font-size:.82rem">（尚無解釋）</div>';
  const _pct=dueQueue.length>0?Math.round(revIdx/dueQueue.length*100):0;
  const _stab=e.sm_stability||0;
  const _diffCls=_stab===0?'diff-new':_stab<7?'diff-hard':_stab<21?'diff-mid':'diff-easy';
  const _diffLbl=_stab===0?'新單字':_stab<7?'學習中':_stab<21?'進步中':'熟悉';
  wrap.innerHTML=`
    <div class="rpb-wrap"><div class="rpb" style="width:${_pct}%"></div></div>
    <div class="prog">${revIdx+1} / ${dueQueue.length}${badge} <span class="diff-badge ${_diffCls}">${_diffLbl}</span></div>
    <div class="flash-card">
      <div class="sentence">${hi}</div>
      <div id="reveal-btn-wrap">
        <button class="btn-reveal" onclick="revealAnswer()">顯示解釋 <span style="font-size:.78em;opacity:.55;font-weight:400">[${scKeyLabel(SHORTCUTS.reveal)}]</span></button>
      </div>
      <div class="reveal-section" id="reveal-section" style="display:none">
        ${zhBlock}
        <div class="rev-btns">
          <button class="btn-y" id="by" onclick="doReview('y')">認識</button>
          <button class="btn-n" id="bn" onclick="doReview('n')">不認識</button>
        </div>
        <div class="feedback" id="fb"></div>
        <div class="card-actions">
          <button class="act-btn act-del" onclick="cardDelete('${e.id}','${esc(e.word)}')">🗑 刪除</button>
          <button class="act-btn act-easy" onclick="cardTooEasy('${e.id}','${esc(e.word)}')">⚡ 太簡單</button>
          <button class="${markCls}" id="mark-btn" onclick="cardMark('${e.id}','${esc(e.word)}')">🔖 ${e.marked?'已標記':'標記'}</button>
        </div>
        <div class="memo-area">
          <textarea id="memo-input" placeholder="備忘（可留空）">${esc(e.memo||'')}</textarea>
          <div class="memo-row">
            <button class="act-btn act-memo" onclick="saveMemo('${e.id}')">儲存備忘</button>
            <span id="memo-msg" class="memo-ok"></span>
          </div>
        </div>
      </div>
    </div>`;
}
function revealAnswer(){
  const s=document.getElementById('reveal-section');
  const b=document.getElementById('reveal-btn-wrap');
  if(s){s.style.display='';}
  if(b){b.style.display='none';}
  document.getElementById('by')?.focus();
}

async function doReview(result){
  if(revIdx>=dueQueue.length) return;
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by) by.disabled=true; if(bn) bn.disabled=true;
  const e=dueQueue[revIdx]; e._r=result;
  const incognito=reviewMode==='incognito'||reviewMode==='quiz';
  const fb=document.getElementById('fb');
  if(!incognito){
    try{
      const grade=result==='y'?3:1;
      const elapsed=fsrsElapsed(e);
      const sched=fsrsSchedule(e,grade,elapsed);
      const nextRev=plusDays(today(),sched.interval);
      const mastered=sched.mastered;
      await sbPost('reviews',{vocab_id:e.id,reviewed_at:today(),result});
      await sbPatch('vocabulary',`id=eq.${e.id}`,{next_review:nextRev,mastered,sm_stability:sched.sm_stability,sm_difficulty:sched.sm_difficulty,sm_reps:sched.sm_reps});
      const vi=vocab.findIndex(v=>v.id===e.id);
      if(vi>=0){
        Object.assign(vocab[vi],{next_review:nextRev,mastered,sm_stability:sched.sm_stability,sm_difficulty:sched.sm_difficulty,sm_reps:sched.sm_reps});
        vocab[vi].reviews=[...(vocab[vi].reviews||[]),{result,reviewed_at:today()}];
        vocab[vi].streak=consecutiveCorrect(vocab[vi].reviews);
      }
      updateStats();
      if(fb){
        const ivLabel=`${sched.interval} 天後`;
        if(result==='y'){fb.textContent=mastered?'🎉 已精熟！':`下次複習：${nextRev}（${ivLabel}）`;fb.style.color='#2e7d32';}
        else{fb.textContent=`下次複習：${nextRev}（${ivLabel}）`;fb.style.color='#c62828';}
      }
    }catch(err){console.error(err);}
  } else {
    if(fb){fb.textContent=result==='y'?'✓（不計入進度）':'✗（不計入進度）';fb.style.color=result==='y'?'#7b1fa2':'#888';}
  }
  revIdx++;
  setTimeout(renderCard,900);
}

async function cardDelete(vid,word){
  if(!confirm(`確定刪除「${word}」這張卡片？`)) return;
  await sbDelete('vocabulary',`id=eq.${vid}`);
  dueQueue.splice(revIdx,1);
  const fb=document.getElementById('fb');
  if(fb){fb.textContent='已刪除';fb.style.color='#c62828';}
  await refreshVocab(); updateStats();
  setTimeout(renderCard,600);
}

async function cardTooEasy(vid,word){
  const incognito=reviewMode==='incognito'||reviewMode==='quiz';
  const e=dueQueue[revIdx]; if(e) e._r='easy';
  const fb=document.getElementById('fb');
  if(fb){fb.textContent=incognito?'⚡ 跳過（不計入進度）':'⚡ 已設為 30 天後複習';fb.style.color='#2e7d32';}
  revIdx++;
  setTimeout(renderCard,900);
  if(!incognito){
    try{
      const e2=vocab.find(v=>v.id===vid)||{};
      const sched=fsrsSchedule({...e2,sm_reps:Math.max(e2.sm_reps||0,1)},4,fsrsElapsed(e2));
      const interval=Math.max(sched.interval,INTERVALS.too_easy);
      const nextRev=plusDays(today(),interval);
      await sbPost('reviews',{vocab_id:vid,reviewed_at:today(),result:'too_easy'});
      await sbPatch('vocabulary',`id=eq.${vid}`,{next_review:nextRev,mastered:false,sm_stability:sched.sm_stability,sm_difficulty:sched.sm_difficulty,sm_reps:sched.sm_reps});
      const vi=vocab.findIndex(v=>v.id===vid);
      if(vi>=0){Object.assign(vocab[vi],{next_review:nextRev,mastered:false,sm_stability:sched.sm_stability,sm_difficulty:sched.sm_difficulty,sm_reps:sched.sm_reps});}
      updateStats();
    }catch(err){}
  }
}

async function cardMark(vid,word){

}

const SC_LABELS={reveal:'顯示解釋',yes:'認識',no:'不認識',del:'刪除',easy:'太簡單',mark:'標記'};
function scKeyLabel(k){return k===' '?'Space':k==='Enter'?'Enter':k==='Escape'?'Esc':(k&&k.length===1?k.toUpperCase():k||'—');}
function saveShortcuts(){localStorage.setItem('gsatword_shortcuts',JSON.stringify(SHORTCUTS));}

function openShortcutModal(){

  }

document.addEventListener('keydown',function scCapture(e){
  if(!_scListening) return;

document.addEventListener('keydown',e=>{
  if(!document.getElementById('panel-review').classList.contains('active')) return;
  if(document.getElementById('shortcut-modal')?.style.display!=='none') return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  const revealed=document.getElementById('reveal-section')?.style.display!=='none';
  const k=e.key;
  const match=(a)=>!a?false:k===a||(a.length===1&&k.toLowerCase()===a.toLowerCase());
  if(match(SHORTCUTS.reveal)){if(!revealed){revealAnswer();e.preventDefault();return;}}
  if(!revealed) return;
  const card=dueQueue[revIdx];
  if(!card) return;
  if(match(SHORTCUTS.yes)){e.preventDefault();doReview('y');}
  else if(match(SHORTCUTS.no)){e.preventDefault();doReview('n');}
  else if(match(SHORTCUTS.del)){e.preventDefault();cardDelete(card.id,card.word);}
  else if(match(SHORTCUTS.easy)){e.preventDefault();cardTooEasy(card.id,card.word);}
  else if(match(SHORTCUTS.mark)){e.preventDefault();cardMark(card.id,card.word);}
});

function setSortCol(col){
  if(sortCol===col){sortDir*=-1;}
  else{sortCol=col;sortDir=_defSortDir[col]??1;}

}
function updateSortHeaders(){
  document.querySelectorAll('th.srt').forEach(th=>{
    const col=th.getAttribute('onclick').match(/'(\w+)'/)[1];
    const si=th.querySelector('.si');
    if(col===sortCol){th.classList.add('srt-on');si.textContent=sortDir===1?' ▲':' ▼';}
    else{th.classList.remove('srt-on');si.textContent='';}
  });
}
function sortedVocab(rows){
  if(!sortCol) return rows;
  return [...rows].sort((a,b)=>{
    if(sortCol==='word')
      return sortDir*(a.word||'').localeCompare(b.word||'');
    if(sortCol==='zh_meaning'){
      const av=a.zh_meaning?1:0, bv=b.zh_meaning?1:0;
      if(av!==bv) return sortDir*(bv-av);
      return (a.word||'').localeCompare(b.word||'');
    }
    if(sortCol==='streak')
      return sortDir*((a.streak??0)-(b.streak??0));
    if(sortCol==='next_review'){
      const av=a.next_review||'9999-99-99', bv=b.next_review||'9999-99-99';
      return sortDir*av.localeCompare(bv);
    }
    if(sortCol==='first_seen'){
      const av=a.first_seen||'', bv=b.first_seen||'';
      return sortDir*av.localeCompare(bv);
    }
    if(sortCol==='mastered')
      return sortDir*((a.mastered?1:0)-(b.mastered?1:0));
    return 0;
  });
}
function filteredVocab(){
  const t=today();
  if(listFilter==='due')      return vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review<=t);
  if(listFilter==='upcoming') return vocab.filter(e=>!e.mastered&&e.next_review&&e.next_review>t);
  if(listFilter==='mastered') return vocab.filter(e=>e.mastered);
  if(listFilter==='marked')   return vocab.filter(e=>e.marked);
  if(listFilter==='memo')     return vocab.filter(e=>e.memo&&e.memo.trim());
  return vocab;
}

async function callAnthropic(messages, maxTokens=256){
  const key=SB_KEY||DEFAULT_SB_KEY;
  const base=(SB_URL||DEFAULT_SB_URL).replace(/\/+$/,'');
  const proxyUrl=base+'/functions/v1/ai-proxy?apikey='+key;
  const res=await fetch(proxyUrl,{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages})
  });
  if(!res.ok){const t=await res.text();throw new Error('AI proxy '+res.status+': '+t.slice(0,200));}
  return res.json();
}

function logAiCost(costUsd,action){
  if(!studentId||!costUsd) return;
  sbPost('ai_usage',{student_id:studentId,cost_usd:costUsd,action}).catch(()=>{});
}
function showCostToast(msg){
  let t=document.getElementById('cost-toast');
  if(!t){t=document.createElement('div');t.id='cost-toast';t.style.cssText='position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:.82rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none';document.body.appendChild(t);}
  t.textContent='AI 費用：'+msg;t.style.opacity='1';
  clearTimeout(t._to);t._to=setTimeout(()=>{t.style.opacity='0';},3000);
}
async function generateExplanation(vid){
  const sidStr=String(vid);
  const e=vocab.find(v=>String(v.id)===sidStr); if(!e) return;
  const btn=document.getElementById('aibtn-'+esc(vid));
  if(btn){btn.textContent='…';btn.disabled=true;}
  const prompt='Word: "'+e.word+'"\nContext: "'+(e.context||'').replace(/"/g,"'").replace(/[\r\n]+/g,' ')+'"\n\nReply in exactly 3 lines, nothing else:\nZH: [concise Traditional Chinese definition, e.g. "（動詞）建立；設立"]\nCTX: [one sentence Traditional Chinese explaining the word in the given context]\nUSE: [one short English usage pattern, e.g. "insist on sth / that + clause"]';
  try{
    const data=await callAnthropic([{role:'user',content:prompt}]);
    const text=data.content?.[0]?.text||'';
    let zh='',ctx='',use='';
    for(const line of text.split('\n')){
      if(line.startsWith('ZH:')) zh=line.slice(3).trim();
      else if(line.startsWith('CTX:')) ctx=line.slice(4).trim();
      else if(line.startsWith('USE:')) use=line.slice(4).trim();
    }
    if(!zh) throw new Error('解析失敗：'+text);
    const ctxFull=ctx+(use?'\n用法：'+use:'');
    await sbPatch('vocabulary','id=eq.'+sidStr,{zh_meaning:zh,context_zh:ctxFull});
    const vi=vocab.findIndex(v=>String(v.id)===sidStr);
    if(vi!==-1){vocab[vi].zh_meaning=zh;vocab[vi].context_zh=ctxFull;}
    const u=data.usage||{};
    // claude-haiku-4-5: $0.80 input / $4.00 output per MTok
    const costUSD=(((u.input_tokens||0)*0.8+(u.output_tokens||0)*4)/1e6);
    const costTWD=(costUSD*32).toFixed(4);
    logAiCost(costUSD,'explain');
    if(btn){btn.title=`上次花費 NT$${costTWD}`;btn.textContent='✨';btn.disabled=false;}
    const costEl=document.getElementById('aicost-'+esc(vid));
    if(costEl){costEl.textContent='NT$'+costTWD;}
    else{const s=document.createElement('span');s.id='aicost-'+esc(vid);s.style.cssText='font-size:.7rem;color:#888;margin-left:2px';s.textContent='NT$'+costTWD;btn&&btn.parentNode&&btn.parentNode.insertBefore(s,btn.nextSibling);}
    showCostToast('NT$'+costTWD);
    updateList();
    return parseFloat(costTWD);
  }catch(err){
    if(btn){btn.textContent='✨';btn.disabled=false;}
    throw err;
  }
}

function toggleWord(evt,chk){
  const id=chk.dataset.id;
  const rows=filteredVocab();
  if(evt.shiftKey&&lastCheckedId){
    const ids=rows.map(e=>e.id);
    const i1=ids.indexOf(lastCheckedId), i2=ids.indexOf(id);
    if(i1!==-1&&i2!==-1){
      const lo=Math.min(i1,i2), hi=Math.max(i1,i2);
      for(let i=lo;i<=hi;i++){if(chk.checked)selectedIds.add(ids[i]);else selectedIds.delete(ids[i]);}
    }
  } else {
    if(chk.checked) selectedIds.add(id); else selectedIds.delete(id);
  }
  lastCheckedId=id;
  rows.forEach(e=>{
    const row=document.getElementById('row-'+esc(e.id));
    if(row) row.className=selectedIds.has(e.id)?'selected':'';
    const cb=row?.querySelector('input[type=checkbox]');
    if(cb) cb.checked=selectedIds.has(e.id);
  });

  document.getElementById('chk-all').checked=rows.length>0&&rows.every(e=>selectedIds.has(e.id));
}

async function doBulkExplain(){
  const ids=[...selectedIds];
  if(!ids.length) return;
  if(!confirm(`對選取的 ${ids.length} 個單字生成 AI 解釋？每個單字會呼叫一次 API。`)) return;
  const bar=document.getElementById('bulk-count');
  let done=0, failed=0, bulkCostTWD=0; const errors=[];
  for(const vid of ids){
    bar.textContent=`生成中 ${++done}/${ids.length}…`;
    try{ bulkCostTWD+=(await generateExplanation(vid))||0; }
    catch(err){ failed++; errors.push(err.message); }
  }
  const costLine=bulkCostTWD>0?`\n總花費：NT$${bulkCostTWD.toFixed(4)}`:'';
  bar.textContent=`已選 ${ids.length} 個${bulkCostTWD>0?' · NT$'+bulkCostTWD.toFixed(4):''}`;
  if(failed) alert(`${done-failed}/${done} 成功，${failed} 個失敗：${costLine}\n\n${errors.join('\n')}`);
  updateList();
}

async function generateForAdd(){
  const word=document.getElementById('a-word').value.trim();
  if(!word){showFormMsg('add-msg','請先輸入單字',false);return;}
  const ctx=document.getElementById('a-ctx').value.trim();
  const btn=document.getElementById('add-gen-btn');
  if(btn){btn.textContent='…';btn.disabled=true;}
  let prompt;
  if(ctx){
    prompt=`Word: "${word}"\nContext: "${ctx.replace(/"/g,"'").replace(/[\r\n]+/g,' ')}"\n\nReply in exactly 3 lines, nothing else:\nZH: [concise Traditional Chinese definition, e.g. "（動詞）建立；設立"]\nCTX: [one sentence Traditional Chinese explaining the word in the given context]\nUSE: [one short English usage pattern, e.g. "insist on sth / that + clause"]`;
  } else {
    prompt=`Word: "${word}"\n\nReply in exactly 4 lines, nothing else:\nSENT: [one natural English example sentence using this word]\nZH: [concise Traditional Chinese definition, e.g. "（動詞）建立；設立"]\nCTX: [one sentence Traditional Chinese explaining the word in the sentence context]\nUSE: [one short English usage pattern, e.g. "insist on sth / that + clause"]`;
  }
  try{
    const data=await callAnthropic([{role:'user',content:prompt}]);
    const text=data.content?.[0]?.text||'';
    let sent='',zh='',ctxZh='',use='';
    for(const line of text.split('\n')){
      if(line.startsWith('SENT:')) sent=line.slice(5).trim();
      else if(line.startsWith('ZH:')) zh=line.slice(3).trim();
      else if(line.startsWith('CTX:')) ctxZh=line.slice(4).trim();
      else if(line.startsWith('USE:')) use=line.slice(4).trim();
    }
    if(!zh) throw new Error('解析失敗：'+text);
    if(sent&&!ctx) document.getElementById('a-ctx').value=sent;
    document.getElementById('a-zh').value=zh;
    _addCtxZh=ctxZh+(use?'\n用法：'+use:'');
    const u=data.usage||{};
    const costUSD=(((u.input_tokens||0)*0.8+(u.output_tokens||0)*4)/1e6);
    const costTWD=(costUSD*32).toFixed(4);
    logAiCost(costUSD,'add_word');
    document.getElementById('add-gen-cost').textContent='NT$'+costTWD;
    showCostToast('NT$'+costTWD);
  }catch(err){
    showFormMsg('add-msg','生成失敗：'+err.message,false);
  }finally{
    if(btn){btn.textContent='✨ 生成';btn.disabled=false;}
  }
}

async function doSync(){
  const cd=document.getElementById('s-date').value;
  const fr=document.getElementById('s-rev').value;
  showSyncLog(''); showFormMsg('sync-msg','','info');
  let text='';
  if(syncTab==='url'){
    const urlVal=document.getElementById('s-url').value.trim();
    if(!urlVal){showFormMsg('sync-msg','請輸入 URL',false);return;}
    const m=urlVal.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(!m){showFormMsg('sync-msg','無效的 Google Docs 網址',false);return;}
    appendSyncLog('正在下載文章…');
    try{
      const r=await fetch(`https://docs.google.com/document/d/${m[1]}/export?format=html`);
      if(!r.ok) throw new Error('下載失敗，請確認文件是否公開');
      text=await r.text();
      appendSyncLog(`下載完成（${text.length} 字元）`);
    }catch(e){showFormMsg('sync-msg','下載失敗：'+e.message,false);return;}
  } else {
    const file=document.getElementById('s-file').files[0];
    if(!file){showFormMsg('sync-msg','請選取 .docx 檔案',false);return;}
    appendSyncLog('正在解析 .docx…');
    try{
      const ab=await file.arrayBuffer();
      const result=await mammoth.convertToHtml({arrayBuffer:ab});
      text=result.value;
      appendSyncLog(`解析完成（${text.length} 字元）`);
    }catch(e){showFormMsg('sync-msg','解析失敗：'+e.message,false);return;}
  }
  appendSyncLog('正在解析粗體單字…');
  const existingWords=vocab.map(v=>v.word.toLowerCase());
  let extracted=[];
  try{
    // Use DOMParser only for full-text extraction (context sentences)
    const parser=new DOMParser();
    const htmlDoc=parser.parseFromString(text,'text/html');
    const fullText=(htmlDoc.body.innerText||htmlDoc.body.textContent||'').replace(/\s+/g,' ');
    const boldWords=new Set();

    // Decode HTML entities before extracting words (prevents &nbsp; → "nbsp" prefix)
    function _decEnt(s){return s.replace(/&[a-z]+;/gi,' ').replace(/&#\d+;/g,' ').replace(/&#x[0-9a-f]+;/gi,' ');}
    function _addWords(raw){_decEnt(raw).trim().split(/[\s\u00a0]+/).forEach(w=>{const c=w.replace(/[^a-zA-Z]/g,'');if(c.length>2)boldWords.add(c.toLowerCase());});}

    // Strategy 1: <b> / <strong> tags (mammoth output)
    const bsRe=/<(?:b|strong)(?:\s[^>]*)?>([^<]+)<\/(?:b|strong)>/gi;
    let bm;while((bm=bsRe.exec(text))!==null){_addWords(bm[1]);}

    // Strategy 2: Google Docs HTML — find bold CSS classes via raw regex on HTML string
    // then find span elements with those classes via raw regex
    const boldClasses=new Set();
    const styleRe=/<style[^>]*>([\s\S]*?)<\/style>/gi;
    let sm;while((sm=styleRe.exec(text))!==null){
      const css=sm[1];
      const clsRe=/\.([a-zA-Z][a-zA-Z0-9_-]*)[^{]*\{[^}]*font-weight\s*:\s*(700|bold)\b[^}]*\}/g;
      let cm;while((cm=clsRe.exec(css))!==null)boldClasses.add(cm[1]);
    }
    if(boldClasses.size>0){
      const pat=Array.from(boldClasses).map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
      const spanRe=new RegExp('<span[^>]+class="[^"]*(?:'+pat+')[^"]*"[^>]*>([^<]+)<\\/span>','gi');
      let sp;while((sp=spanRe.exec(text))!==null){_addWords(sp[1]);}
    }

    // Strategy 3: inline style font-weight (fallback)
    const inlineRe=/<span[^>]+style="[^"]*font-weight\s*:\s*(?:700|bold)[^"]*"[^>]*>([^<]+)<\/span>/gi;
    let im;while((im=inlineRe.exec(text))!==null){_addWords(im[1]);}


    const sentences=fullText.split(/(?<=[.!?])\s+/);
    for(const word of boldWords){
      const re=new RegExp('(?<![a-zA-Z])'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-zA-Z])','i');
      const ctx=sentences.find(s=>re.test(s))||'';
      extracted.push({word,context:ctx.trim(),zh_meaning:'',context_zh:''});
    }
    appendSyncLog(`找到 ${extracted.length} 個粗體單字`);
  }catch(e){showFormMsg('sync-msg','解析失敗：'+e.message,false);return;}
  const newWords=extracted.filter(w=>!existingWords.includes(w.word.toLowerCase()));
  appendSyncLog(`其中 ${newWords.length} 個是新單字，開始匯入…`);
  let added=0; lastImportIds=[];
  for(const w of newWords){
    try{
      const rows=await sbPost('vocabulary',{student_id:studentId,word:w.word,zh_meaning:w.zh_meaning||'',context:w.context||'',context_zh:w.context_zh||'',first_seen:cd,next_review:fr});
      if(rows&&rows[0]&&rows[0].id) lastImportIds.push(rows[0].id);
      added++;
    }catch(e){appendSyncLog(`  略過「${w.word}」`);}
  }
  appendSyncLog(`完成！新增了 ${added} 個，跳過 ${extracted.length-newWords.length} 個已存在`);
  showFormMsg('sync-msg',`新增 ${added} 個，跳過 ${extracted.length-newWords.length} 個已存在`,true);
  if(lastImportIds.length){
    const b=document.getElementById('undo-banner');
    document.getElementById('undo-label').textContent=`本次匯入了 ${lastImportIds.length} 個單字`;
    b.style.display='flex';
  }
  await refreshVocab(); updateStats();
  // Auto-explain if checkbox checked
  if(document.getElementById('s-autoexplain').checked && lastImportIds.length){
    appendSyncLog(`開始為 ${lastImportIds.length} 個新單字生成 AI 解釋…`);
    let eIdx=0;
    for(const vid of lastImportIds){
      appendSyncLog(`  解釋 ${++eIdx}/${lastImportIds.length}：${vocab.find(v=>v.id===vid)?.word||vid}`);
      await generateExplanation(vid);
    }
    appendSyncLog('解釋生成完成！');
    updateList();
  }
}

function showSyncLog(t){const el=document.getElementById('sync-log');el.style.display='block';el.textContent=t;}
function appendSyncLog(t){const el=document.getElementById('sync-log');el.style.display='block';el.textContent+=t+'\n';}
function showFormMsg(id,msg,ok){
  const el=document.getElementById(id); if(!el) return;
  if(!msg){el.innerHTML='';return;}
  const cls=ok===true?'ok':ok===false?'err':'info';
  el.innerHTML=`<div class="msg-box ${cls}">${msg}</div>`;
}

// ── Teacher View ──────────────────────────────────────────────────────────────
async function loadTeacherView(){
  try{
    const t=today();
    const ago30=plusDays(t,-30);
    // 清理 90 天前的登入紀錄（fire and forget）
    sbFetch(`/rest/v1/student_sessions?logged_in_at=lt.${plusDays(t,-90)}`,{method:'DELETE'}).catch(()=>{});
    const [students,allVocab,sessions,recentRevs,allCosts]=await Promise.all([
      sbGet('students','select=id,name,token&order=name'),
      sbGet('vocabulary','select=id,student_id,mastered,next_review'),
      sbGet('student_sessions',`select=student_id,logged_in_at&logged_in_at=gte.${ago30}&order=logged_in_at.desc`),
      sbGet('reviews',`select=vocab_id,result,reviewed_at&reviewed_at=gte.${ago30}&order=reviewed_at.desc`),
      sbGet('ai_usage','select=student_id,cost_usd,created_at,action&order=created_at.desc')
    ]);
    // costs per student
    const costMap={};
    for(const c of allCosts){
      if(!costMap[c.student_id]) costMap[c.student_id]=[];
      costMap[c.student_id].push(c);
    }
    // Build maps
    const vocabSid={};
    for(const v of allVocab) vocabSid[v.id]=v.student_id;
    // sessions per student
    const sessMap={};
    for(const s of sessions){
      if(!sessMap[s.student_id]) sessMap[s.student_id]=[];
      sessMap[s.student_id].push(s.logged_in_at);
    }
    // reviews per student
    const revMap={};
    for(const r of recentRevs){
      const sid=vocabSid[r.vocab_id]; if(!sid) continue;
      if(!revMap[sid]) revMap[sid]=[];
      revMap[sid].push(r);
    }
    hide('loading-screen');
    show('teacher-view');
    const grid=document.getElementById('teacher-grid');
    const baseUrl=location.origin+location.pathname;
    grid.innerHTML=students.map(s=>{
      const sv=allVocab.filter(v=>v.student_id===s.id);
      const due=sv.filter(v=>!v.mastered&&v.next_review&&v.next_review<=t).length;
      const mastered=sv.filter(v=>v.mastered).length;
      const total=sv.length;
      const link=`${baseUrl}?s=${encodeURIComponent(s.token)}`;
      // Activity
      const srvs=revMap[s.id]||[];
      const ssns=sessMap[s.id]||[];
      const lastSess=ssns[0]||null;
      const lastRev=srvs[0]?.reviewed_at||null;
      const lastActive=lastSess||lastRev;
      const daysSince=lastActive?Math.floor((new Date(t)-new Date(lastActive.slice(0,10)))/86400000):999;
      const weekRevs=srvs.filter(r=>r.reviewed_at>=plusDays(t,-7)).length;
      const dotCls=daysSince===0?'green':daysSince<=3?'yellow':'red';
      const activeLabel=daysSince===0?'今天活躍':daysSince===1?'昨天':daysSince<999?`${daysSince} 天未登入`:'從未登入';
      const sCosts=costMap[s.id]||[];
      const totalTWD=sCosts.reduce((a,c)=>a+c.cost_usd,0)*32;
      const costLabel=totalTWD>0?`NT$${totalTWD.toFixed(2)}`:'NT$0';
      return `<div style="background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .15s" onmouseover="this.style.boxShadow='0 3px 12px rgba(0,0,0,.12)'" onmouseout="this.style.boxShadow='0 1px 4px rgba(0,0,0,.07)'" onclick="showStudentDetail('${s.id}','${esc(s.name)}')">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-status"><span class="sc-dot ${dotCls}"></span><span>${activeLabel}</span><span style="margin-left:auto;color:#888">本週 ${weekRevs} 次</span></div>
        <div class="sc-stats"><span class="due">今日 ${due}</span><span class="mastered">精熟 ${mastered}</span><span>總 ${total}</span></div>
        <div style="font-size:.77rem;color:#888;margin:5px 0 2px">累計 AI 費用：<span style="color:#e65100;font-weight:600">${costLabel}</span></div>
        <div class="sc-act-row">
          <a href="${link}" target="_blank" onclick="event.stopPropagation()" style="color:#1a0dab;font-size:.72rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${link}</a>
          <button class="sm" style="flex-shrink:0" onclick="event.stopPropagation();copyLink('${link}',this)">複製</button>
          <button class="sc-act-btn" onclick="event.stopPropagation();showStudentActivity('${s.id}','${esc(s.name)}')">📊</button>
        </div>
      </div>`;
    }).join('');
    // Cache for activity modal
    window._tcache={students,allVocab,sessMap,revMap,vocabSid,costMap};
  }catch(e){hide('loading-screen');showError('Teacher 載入失敗',e.message);}
}

function copyLink(link,btn){
  navigator.clipboard.writeText(link).then(()=>{const orig=btn.textContent;btn.textContent='已複製！';setTimeout(()=>btn.textContent=orig,1500);});
}

async function addStudentPrompt(){
  const name=(prompt('學生名稱：')||'').trim(); if(!name) return;
  if(!/^[\w\u4e00-\u9fff\u3400-\u4dbf\-\s]+$/.test(name)){alert('名稱不能包含特殊符號。');return;}
  try{
    const existing=await sbGet('students',`name=eq.${encodeURIComponent(name)}&select=id,token`);
    if(existing.length){
      const link=`${location.origin+location.pathname}?s=${encodeURIComponent(existing[0].token)}`;
      if(confirm(`學生「${name}」已存在。\n\n複製連結到剪貼簿？\n${link}`))
        navigator.clipboard.writeText(link);
      return;
    }
    const rows=await sbPost('students',{name});
    const token=(rows[0]||rows).token;
    const link=`${location.origin+location.pathname}?s=${encodeURIComponent(token)}`;
    navigator.clipboard.writeText(link).catch(()=>{});
    alert(`已新增學生「${name}」！\n\n學生連結（已複製到剪貼簿）：\n${link}`);
    await loadTeacherView();
  }catch(e){alert('新增失敗：'+e.message);}
}

async function restoreBackup(input){
  const file=input.files[0]; if(!file) return;
  input.value='';
  let data;
  try{ data=JSON.parse(await file.text()); }catch(e){alert('JSON 格式錯誤：'+e.message);return;}
  if(!data.students||!data.vocab){alert('備份格式不正確（缺少 students 或 vocab）');return;}
  if(!confirm(`確定回復備份？\n\n備份時間：${data.exported_at||'不明'}\n學生數：${data.students.length}\n單字數：${data.vocab.length}\n複習記錄：${(data.reviews||[]).length} 筆\n\n⚠️ 這會覆蓋 Supabase 中同名學生的資料（不會刪除備份中沒有的學生）。`)) return;
  try{
    // Upsert students (by name)
    for(const s of data.students){
      const ex=await sbGet('students',`name=eq.${encodeURIComponent(s.name)}&select=id`);
      if(!ex.length) await sbPost('students',{name:s.name});
    }
    // Build name→id map
    const dbStudents=await sbGet('students','select=id,name');
    const nameToId=Object.fromEntries(dbStudents.map(s=>[s.name,s.id]));
    // Upsert vocab
    for(const s of data.students){
      const sid=nameToId[s.name]; if(!sid) continue;
      const sVocab=data.vocab.filter(v=>v.student_id===s.id);
      for(const v of sVocab){
        const row={student_id:sid,word:v.word,context:v.context||'',zh_meaning:v.zh_meaning||'',
          context_zh:v.context_zh||'',mastered:!!v.mastered,next_review:v.next_review||null,
          first_seen:v.first_seen||null,memo:v.memo||'',marked:!!v.marked};
        await sbFetch(`/rest/v1/vocabulary?on_conflict=student_id,word`,{
          method:'POST',body:JSON.stringify(row),
          headers:{'Prefer':'return=representation,resolution=merge-duplicates'}
        });
      }
    }
    // Restore reviews (skip if already exist — best effort)
    if(data.reviews&&data.reviews.length){
      // Build old_vocab_id → new_vocab_id map
      const dbVocab=await sbGet('vocabulary','select=id,student_id,word');
      const oldVocabMap=Object.fromEntries(data.vocab.map(v=>[v.id,v]));
      const newVocabMap=Object.fromEntries(dbVocab.map(v=>[`${v.student_id}_${v.word}`,v.id]));
      const reviews=data.reviews.map(r=>{
        const ov=oldVocabMap[r.vocab_id]; if(!ov) return null;
        const ownerSid=nameToId[data.students.find(s=>s.id===ov.student_id)?.name];
        const newVid=newVocabMap[`${ownerSid}_${ov.word}`];
        if(!newVid) return null;
        return {vocab_id:newVid,reviewed_at:r.reviewed_at,result:r.result};
      }).filter(Boolean);
      for(let i=0;i<reviews.length;i+=200)
        await sbPost('reviews',reviews.slice(i,i+200));
    }
    alert('回復完成！');
    await loadTeacherView();
  }catch(e){alert('回復失敗：'+e.message);}
}

function showStudentActivity(sid,name){
  const c=window._tcache||{}; if(!c.allVocab) return;
  const t=today();
  const srvs=(c.revMap||{})[sid]||[];
  const ssns=(c.sessMap||{})[sid]||[];
  // KPIs
  const total30=srvs.length;
  const correct30=srvs.filter(r=>r.result==='y').length;
  const acc=total30?Math.round(correct30/total30*100):0;
  // Days with at least 1 review in last 30 days
  const activeDays=new Set(srvs.map(r=>r.reviewed_at.slice(0,10)));
  const avgPerDay=activeDays.size?Math.round(total30/activeDays.size):0;
  // Consecutive streak (from today backwards)
  let streak=0;
  for(let i=0;i<60;i++){const d=plusDays(t,-i);if(activeDays.has(d))streak++;else if(i>0)break;}
  // Vocab stats
  const sv=(c.allVocab||[]).filter(v=>v.student_id===sid);
  const due=sv.filter(v=>!v.mastered&&v.next_review&&v.next_review<=t).length;
  const mastered=sv.filter(v=>v.mastered).length;
  // Heatmap: last 30 days
  const dayCount={};
  for(const r of srvs) dayCount[r.reviewed_at.slice(0,10)]=(dayCount[r.reviewed_at.slice(0,10)]||0)+1;
  const heatCells=[];
  for(let i=29;i>=0;i--){
    const d=plusDays(t,-i);
    const n=dayCount[d]||0;
    const bg=n===0?'#f0f0f0':n<=3?'#c8e6c9':n<=7?'#66bb6a':'#2e7d32';
    heatCells.push(`<div class="hm-cell" style="background:${bg}" data-tip="${d.slice(5)}: ${n}次"></div>`);
  }
  // Sessions list
  const sessHtml=ssns.length
    ?ssns.slice(0,15).map(s=>`${s.slice(0,10)} ${s.slice(11,16)}`).join('<br>')
    :'（無登入記錄）';
  // Billing
  const sCosts=(c.costMap||{})[sid]||[];
  const totalUSD=sCosts.reduce((a,x)=>a+x.cost_usd,0);
  const totalTWD=(totalUSD*32).toFixed(2);
  const actionLabel={explain:'解釋生成',add_word:'新增單字',bulk_explain:'批量生成'};
  // monthly breakdown
  const monthMap={};
  for(const x of sCosts){
    const m=x.created_at.slice(0,7);
    if(!monthMap[m]) monthMap[m]={usd:0,count:0};
    monthMap[m].usd+=x.cost_usd; monthMap[m].count++;
  }
  const monthRows=Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0]))

// ── Review interval settings ──────────────────────────────────────────────────
async function loadStudentIntervals(sid){
  try{
    const rows=await sbGet('app_config',`key=eq.intervals_${sid}&select=value`);
    if(rows.length) INTERVALS={...GLOBAL_INTERVALS,...JSON.parse(rows[0].value)};
    else INTERVALS={...GLOBAL_INTERVALS};
  }catch(e){ INTERVALS={...GLOBAL_INTERVALS}; }
}
function openIntervals(){
  const isPerStudent=!!teacherCurrentSid;
  document.getElementById('iv-context').textContent=isPerStudent
    ?`目前：${teacherCurrentName} 個別設定（空白欄位用全域預設）`
    :'目前：全域預設（套用到無個別設定的學生）';
  document.getElementById('iv-s0').value=INTERVALS.s0;
  document.getElementById('iv-s1').value=INTERVALS.s1;
  document.getElementById('iv-s2').value=INTERVALS.s2;
  document.getElementById('iv-s3').value=INTERVALS.s3;
  document.getElementById('iv-easy').value=INTERVALS.too_easy;
  document.getElementById('iv-master').value=INTERVALS.master_at;
  document.getElementById('iv-msg').textContent='';
  document.getElementById('intervals-modal').classList.add('open');
}
function closeIntervals(){document.getElementById('intervals-modal').classList.remove('open');}
async function saveIntervals(){
  const s0=+document.getElementById('iv-s0').value;
  const s1=+document.getElementById('iv-s1').value;
  const s2=+document.getElementById('iv-s2').value;
  const s3=+document.getElementById('iv-s3').value;
  const easy=+document.getElementById('iv-easy').value;
  const master=+document.getElementById('iv-master').value;
  if([s0,s1,s2,s3,easy,master].some(v=>!v||v<1)){
    document.getElementById('iv-msg').textContent='所有欄位需大於 0'; return;
  }
  const val=JSON.stringify({s0,s1,s2,s3,master_at:master,too_easy:easy});
  const configKey=teacherCurrentSid?`intervals_${teacherCurrentSid}`:'review_intervals';
  try{
    // Upsert: PATCH first; if row missing, POST
    const existing=await sbGet('app_config',`key=eq.${configKey}&select=key`);
    if(existing.length){
      await sbFetch(`/rest/v1/app_config?key=eq.${configKey}`,{
        method:'PATCH',body:JSON.stringify({value:val}),
        headers:{'Prefer':'return=representation'}
      });
    } else {
      await sbPost('app_config',{key:configKey,value:val});
    }
    INTERVALS={s0,s1,s2,s3,master_at:master,too_easy:easy};
    if(!teacherCurrentSid) GLOBAL_INTERVALS={...INTERVALS};
    document.getElementById('iv-msg').textContent='已儲存！';
    setTimeout(closeIntervals,800);
  }catch(e){document.getElementById('iv-msg').textContent='儲存失敗：'+e.message;}
}

// ── Stats ─────────────────────────────────────────────────────────────────────
let statsCharts={};

async function renderStats(){
  // Collect all reviews from vocab
  const allReviews=vocab.flatMap(v=>(v.reviews||[]).map(r=>({...r,reviewed_at:r.reviewed_at})));
  // For daily stats, fetch reviews with dates directly from Supabase
  let fullReviews=[];
  try{
    const ids=vocab.map(v=>v.id);
    if(ids.length){
      fullReviews=await sbGet('reviews',`vocab_id=in.(${ids.join(',')})&select=vocab_id,reviewed_at,result&order=reviewed_at.asc`);
    }
  }catch(e){}

  const t=today();

  // Last 30 days range
  const days30=[]; for(let i=29;i>=0;i--) days30.push(plusDays(t,-i));

  // Daily review counts and accuracy
  const dailyCount={}, dailyCorrect={}, dailyTotal={};
  for(const d of days30){dailyCount[d]=0;dailyCorrect[d]=0;dailyTotal[d]=0;}
  for(const r of fullReviews){
    const d=r.reviewed_at;
    if(dailyCount[d]!==undefined){
      dailyCount[d]++;
      dailyTotal[d]++;
      if(r.result==='y') dailyCorrect[d]++;
    }
  }
  const dailyAcc=days30.map(d=>dailyTotal[d]>0?Math.round(dailyCorrect[d]/dailyTotal[d]*100):null);
  const labels30=days30.map(d=>d.slice(5)); // MM-DD

  // Word growth (cumulative by first_seen)
  const byDate={};
  for(const v of vocab){
    const d=v.first_seen||t;
    byDate[d]=(byDate[d]||0)+1;
  }
  const growthDates=Object.keys(byDate).sort();
  let cum=0;
  const growthData=growthDates.map(d=>{cum+=byDate[d];return cum;});

  // Forecast: next 14 days
  const forecast=[];
  const fDays=[]; for(let i=0;i<14;i++) fDays.push(plusDays(t,i));
  for(const d of fDays){
    forecast.push(vocab.filter(v=>!v.mastered&&v.next_review===d).length);
  }

  // Status donut
  const mastered=vocab.filter(v=>v.mastered).length;
  const due=vocab.filter(v=>!v.mastered&&v.next_review&&v.next_review<=t).length;
  const upcoming=vocab.filter(v=>!v.mastered&&v.next_review&&v.next_review>t).length;

  // Streak distribution
  const streakBuckets={0:0,1:0,2:0,3:0,'4+':0};
  for(const v of vocab){
    const s=v.streak||0;
    if(s>=4) streakBuckets['4+']++;
    else streakBuckets[s]++;
  }

  // Destroy old charts
  Object.values(statsCharts).forEach(c=>c.destroy());
  statsCharts={};

  const mkChart=(id,type,labels,datasets,opts={})=>{
    const ctx=document.getElementById(id);
    if(!ctx) return;
    statsCharts[id]=new Chart(ctx,{type,data:{labels,datasets},options:{responsive:true,plugins:{legend:{display:datasets.length>1}},scales:type==='doughnut'?{}:{y:{beginAtZero:true},...(opts.scales||{})}}});
  };

  mkChart('chart-daily','bar',labels30,[{label:'複習數',data:days30.map(d=>dailyCount[d]),backgroundColor:'#1a1a1a88',borderRadius:4}]);
  mkChart('chart-acc','line',labels30,[{label:'答對率 %',data:dailyAcc,borderColor:'#2e7d32',backgroundColor:'#2e7d3222',tension:.3,spanGaps:true,fill:true}]);
  mkChart('chart-growth','line',growthDates.map(d=>d.slice(5)),[{label:'累積單字數',data:growthData,borderColor:'#1565c0',backgroundColor:'#1565c022',tension:.3,fill:true}]);
  mkChart('chart-forecast','bar',fDays.map(d=>d.slice(5)),[{label:'待複習',data:forecast,backgroundColor:'#c6282866',borderRadius:4}]);
  mkChart('chart-status','doughnut',['已精熟','今日到期','未來'],[{data:[mastered,due,upcoming],backgroundColor:['#2e7d32','#c62828','#1565c0']}]);
  mkChart('chart-streak','bar',['0次','1次','2次','3次','4+次'],[{label:'單字數',data:Object.values(streakBuckets),backgroundColor:'#7b1fa288',borderRadius:4}]);
}

  [1,1,'歡迎！踏出第一步，開始你的單字旅程 🌱'],
  [2,3,'連續 {n} 天！好的開始是成功的一半 🎯'],

];
const CI_MILESTONES = new Set([7,14,21,30,50,100,200,365]);

function ciMsg(n){
  for(const [lo,hi,m] of CI_MSGS){
    if(n>=lo&&n<=hi) return m.replace('{n}',n);
  }
  return `連續 ${n} 天！你太強了 🚀`;
}

function ciConfetti(){
  const colors=['#ff6b35','#ffd700','#a78bfa','#60a5fa','#34d399','#f472b6'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='ci-confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%colors.length]};animation-duration:${1.2+Math.random()*1.6}s;animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),(3000+Math.random()*1600));
  }
}

function ciCalendar(loginDays, todayStr){
  const [y,m] = todayStr.split('-').map(Number);
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('ci-cal-title').textContent = `${y} 年 ${monthNames[m-1]}`;
  const firstDay = new Date(y,m-1,1).getDay(); // 0=Sun
  const daysInMonth = new Date(y,m,0).getDate();
  const monthPrefix = `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}`;
  const cells = [];
  // Header
  ['日','一','二','三','四','五','六'].forEach(d=>{
    cells.push(`<div class="ci-cal-hd">${d}</div>`);
  });
  for(let i=0;i<firstDay;i++) cells.push('<div class="ci-cal-day empty"></div>');
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${monthPrefix}-${String(d).padStart(2,'0')}`;
    const hasLogin = loginDays.has(ds);
    const isToday = ds === todayStr;
    let cls = 'ci-cal-day';
    if(hasLogin) cls += ' has-login';
    if(isToday) cls += ' today';
    cells.push(`<div class="${cls}">${d}</div>`);
  }
  document.getElementById('ci-calendar').innerHTML = cells.join('');
}

async function showCheckinModal(sid){
  const todayStr = today();
  const ck = `gsatword_ci_${sid}`;
  if(localStorage.getItem(ck) === todayStr) return;
  localStorage.setItem(ck, todayStr);

  // Fetch last 120 days of sessions
  const ago120 = plusDays(todayStr,-120);
  let sessions = [];
  try{ sessions = await sbGet('student_sessions',`student_id=eq.${sid}&logged_in_at=gte.${ago120}&select=logged_in_at`); }catch(e){ return; }

  const loginDays = new Set(sessions.map(s=>s.logged_in_at.slice(0,10)));
  loginDays.add(todayStr); // include today's fresh login

  // Streak (consecutive days ending today)
  let streak = 0;
  for(let i=0;i<120;i++){
    if(loginDays.has(plusDays(todayStr,-i))) streak++;
    else if(i>0) break;
  }

  // Monthly count
  const mp = todayStr.slice(0,7);
  const monthCount = [...loginDays].filter(d=>d.startsWith(mp)).length;

  // Total unique days
  const totalDays = loginDays.size;

  // Render
  document.getElementById('ci-streak-num').textContent = streak;
  document.getElementById('ci-msg').textContent = ciMsg(streak);
  document.getElementById('ci-month-count').textContent = monthCount;
  document.getElementById('ci-total-days').textContent = totalDays;
  ciCalendar(loginDays, todayStr);

  const badge = document.getElementById('ci-milestone-badge');
  if(CI_MILESTONES.has(streak)){
    badge.textContent = `🏅 ${streak} 天里程碑！`;
    badge.style.display = '';
    setTimeout(ciConfetti, 400);
  } else {
    badge.style.display = 'none';
  }

  document.getElementById('ci-overlay').style.display = 'flex';
}
